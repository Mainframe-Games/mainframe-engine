name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run on any branch: gh workflow run ci.yml --ref <branch>
  workflow_call: # publish.yml re-runs the full suite before releasing

concurrency:
  # github.workflow is the caller's name under workflow_call, so publish never cancels a push run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # PNG content (sky, Spine atlases, goldens) lives in Git LFS

      # Only the managed build needs Spine; native submodules (RmlUi, FreeType, ENet) are natives.yml's job.
      - run: git submodule update --init --depth 1 Plugins/Spine

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MainframeEngine.sln

      # GetText.Extractor (M9): the extraction unit test runs the pinned local tool.
      - name: Restore dotnet tools
        run: dotnet tool restore

      # GNU msgfmt lets the unit tests and the catalog check prove mf-l10n's .mo output is byte-identical.
      - name: Install gettext (msgfmt)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          msgfmt --version | head -1

      # CompileShaders=false: the runners have no glslc, so use the committed .spv (the shaders job checks them
      # against their sources); otherwise the "glslc not found" build warning would fail -warnaserror.
      - name: Build (warnings are errors)
        run: dotnet build MainframeEngine.sln -c Release --no-restore -warnaserror -p:CompileShaders=false

      - name: Unit tests
        run: >-
          dotnet test Tests/MainframeEngine.Tests -c Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      # Committed .mo files match their .po, translations keep their placeholders (and msgfmt -c agrees where installed).
      - name: Localization catalogs
        run: dotnet run --project Tools/MainframeEngine.L10n -c Release --no-build -- check --dir MainframeEngine.Sandbox/Content/locale --msgfmt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - run: git submodule update --init --depth 1 Plugins/Spine

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: dotnet format
        run: dotnet format MainframeEngine.sln --verify-no-changes --exclude Plugins/Spine

  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install glslc and SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc spirv-tools
          glslc --version
          spirv-val --version

      - name: Compile and validate every shader
        run: sh build/shaders.sh compile "$RUNNER_TEMP/spv"

      - name: Committed SPIR-V matches its sources (shaders.lock)
        run: sh build/shaders.sh check

  render-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Lavapipe (Mesa's CPU Vulkan driver) only: deterministic output for the 'lavapipe' goldens.
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      # SDL2 picks its video driver at runtime; Xvfb is X11 (no Wayland compositor on the runner).
      SDL_VIDEODRIVER: x11
      # No sound device on the runner; SDL subsystems that probe audio must not fail window creation.
      SDL_AUDIODRIVER: dummy
      RENDER_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/render-tests
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Only the managed build needs Spine; native submodules (RmlUi, FreeType, ENet) are natives.yml's job.
      - run: git submodule update --init --depth 1 Plugins/Spine

      - name: Install lavapipe, validation layers and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-validationlayers libvulkan1 vulkan-tools xvfb xauth \
            libx11-6 libx11-xcb1 libxext6 libxfixes3 libxrandr2 libxinerama1 libxcursor1 libxi6 libxss1 libxkbcommon0
          ls -l /usr/share/vulkan/icd.d/ /usr/share/vulkan/explicit_layer.d/
          test -f "$VK_DRIVER_FILES"
          vulkaninfo --summary

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build render tests
        run: dotnet build Tests/MainframeEngine.RenderTests -c Release -warnaserror -p:CompileShaders=false

      - name: Render tests (golden images, validation gate, allocation gate)
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24"
          dotnet test Tests/MainframeEngine.RenderTests -c Release --no-build
          --logger "trx;LogFileName=render-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      # A frame without a lavapipe golden skips only its comparison (every other check of the test runs); the test
      # copies it to new-goldens/lavapipe/. List them as warnings and in the job summary (testing.md, "Recording goldens").
      - name: Frames without a golden
        if: always()
        run: |
          dir=artifacts/render-tests/new-goldens
          files=""
          if [ -d "$dir" ]; then files=$(cd "$dir" && find . -name '*.png' | sed 's|^\./||' | sort); fi
          if [ -z "$files" ]; then
            echo "Every compared frame has a golden."
            exit 0
          fi
          echo "### Frames without a golden (comparison skipped)" >> "$GITHUB_STEP_SUMMARY"
          for f in $files; do
            echo "::warning title=No golden::$f: golden comparison skipped; review and commit it from the render-tests artifact (new-goldens/)"
            echo "- \`$f\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # Always uploaded: on failure it holds actual/expected/diff PNGs; frames without a golden are in
      # new-goldens/<tag>/, ready to review and commit under Tests/MainframeEngine.RenderTests/Goldens/<tag>/.
      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-tests
          path: |
            artifacts/render-tests/
            TestResults/**/*.trx
          if-no-files-found: warn

  template:
    # `dotnet new mfgame` from source against this checkout, build it, run its GameHost launcher headless for 30
    # frames on lavapipe (build/template-smoke.sh; `just template-smoke` locally).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      SDL_VIDEODRIVER: x11
      SDL_AUDIODRIVER: dummy
      CONFIGURATION: Release
      BUILD_ARGS: -p:CompileShaders=false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - run: git submodule update --init --depth 1 Plugins/Spine

      - name: Install lavapipe and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 xvfb xauth \
            libx11-6 libx11-xcb1 libxext6 libxfixes3 libxrandr2 libxinerama1 libxcursor1 libxi6 libxss1 libxkbcommon0
          test -f "$VK_DRIVER_FILES"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Instantiate, build and run the mfgame template
        run: xvfb-run -a -s "-screen 0 1280x1024x24" build/template-smoke.sh "$RUNNER_TEMP/template-smoke" 30

      - name: Pack the template package
        run: dotnet pack Templates/MainframeEngine.Templates -c Release -o "$RUNNER_TEMP/templates"

      - name: Upload the smoke game's log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-smoke-log
          path: |
            ${{ runner.temp }}/template-smoke/userdata/**/*.log
            ${{ runner.temp }}/template-smoke/screenshot.png
          if-no-files-found: warn

  ci-success:
    # The single required status check (repo ruleset). Do not rename.
    if: always()
    needs: [build-test, format, shaders, render-tests, template]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed ($result)."
              exit 1
            fi
          done
