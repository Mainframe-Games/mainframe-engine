name: publish

# Manual release of the editor and the MainframeEngine NuGet package. Only brogan89 can run it, and only from main.
# Version = latest vX.Y.Z tag with the chosen part bumped (input "bump": patch by default, minor or major; first
# release: v1.0.0). Nothing is committed to main: the version lives in the tag, and builds get it via -p:Version.
# The packages (MainframeEngine, MainframeEngine.Templates) go to nuget.org after the GitHub Release exists, through
# nuget.org Trusted Publishing (no stored API key): a policy owned by the Mainframe-Games organization trusts this
# repository's publish.yml in the "release" environment; NuGet/login exchanges the job's OIDC token for a 1-hour key.
# NUGET_USER below is the nuget.org username (not a secret) of the organization member who created that policy.
# See docs/design/release.md and docs/design/distribution-nuget.md.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest vX.Y.Z tag to bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_USER: brogan # nuget.org Trusted Publishing: who created the Mainframe-Games policy (see the header)
  EDITOR_PROJECT: MainframeEngine.Editor/MainframeEngine.Editor.csproj

jobs:
  guard:
    name: guard (main + brogan89 only)
    if: github.ref == 'refs/heads/main' && github.actor == 'brogan89'
    runs-on: ubuntu-24.04
    environment: release # deployment branch policy: main only
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          version="$(build/next-version.sh "${BUMP}")"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version} from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.rid }})
    needs: [guard, ci]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The editor build needs only the engine's and editor's LFS content.
      # Git LFS objects are cached by object ID (.lfs-assets-id), so repeat runs use no LFS bandwidth.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: List LFS objects
        shell: bash
        run: git lfs ls-files -l --exclude="docs/images/*.png,docs/images/demo/**,Examples/**,Tests/**" | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-publish-${{ runner.os }}-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-publish-${{ runner.os }}-

      - name: Fetch LFS objects
        shell: bash
        run: git lfs pull --exclude="docs/images/*.png,docs/images/demo/**,Examples/**,Tests/**"

      - run: git submodule update --init --depth 1 Plugins/Spine

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish editor
        shell: bash
        run: >-
          dotnet publish "$EDITOR_PROJECT" -c Release -r ${{ matrix.rid }} --self-contained
          -p:Version=${{ needs.guard.outputs.version }}
          -p:PublishReadyToRun=true -p:CompileShaders=false -warnaserror
          -o artifacts/publish/${{ matrix.rid }}

      - name: Package
        shell: bash
        run: build/package-editor.sh ${{ matrix.rid }} ${{ needs.guard.outputs.version }} artifacts/publish/${{ matrix.rid }} artifacts/release

      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  package:
    name: package (MainframeEngine + MainframeEngine.Templates NuGet)
    needs: [guard, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The package carries the engine's content and natives (LFS) and the brand icon.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch the engine's LFS objects
        run: git lfs pull --include="MainframeEngine/**,docs/images/brand/**"

      - run: git submodule update --init --depth 1 Plugins/Spine

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack MainframeEngine and MainframeEngine.Templates
        env:
          PACK_ARGS: -p:CompileShaders=false -warnaserror
        run: build/pack-nuget.sh "${{ needs.guard.outputs.version }}" artifacts/nuget

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget/*
          if-no-files-found: error

  demo:
    needs: [guard, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch the Demo's LFS objects
        run: git lfs pull --include="Examples/Demo/**"

      - name: Package the Demo
        run: build/package-example.sh Demo "${{ needs.guard.outputs.version }}" artifacts/release

      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: artifacts/release/MainframeEngine.Demo*.zip
          if-no-files-found: error

  forest:
    needs: [guard, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch the Forest's LFS objects
        run: git lfs pull --include="Examples/Forest/**"

      - name: Package the Forest
        run: build/package-example.sh Forest "${{ needs.guard.outputs.version }}" artifacts/release

      - uses: actions/upload-artifact@v4
        with:
          name: forest
          path: artifacts/release/MainframeEngine.Forest*.zip
          if-no-files-found: error

  neon:
    needs: [guard, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch Neon's LFS objects
        run: git lfs pull --include="Examples/Neon/**"

      - name: Package Neon
        run: build/package-example.sh Neon "${{ needs.guard.outputs.version }}" artifacts/release

      - uses: actions/upload-artifact@v4
        with:
          name: neon
          path: artifacts/release/MainframeEngine.Neon*.zip
          if-no-files-found: error

  release:
    needs: [guard, build, package, demo, forest, neon]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create the tag and the release
      id-token: write # nuget.org Trusted Publishing (NuGet/login)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{editor-*,demo,forest,neon}"
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nuget

      - name: Create tag v${{ needs.guard.outputs.version }} and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          ls -l release
          gh release create "v${VERSION}" release/* nuget/*.nupkg \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Mainframe Engine & Editor v${VERSION}" \
            --generate-notes

      # After the tag and the release, so a failed release never leaves a published package behind (nuget.org packages
      # can be unlisted, never deleted). The .snupkg next to the engine package is pushed to the symbol server too.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Trusted Publishing: a short-lived (1 hour) API key for this run, requested right before the push.
      - name: nuget.org login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push MainframeEngine and MainframeEngine.Templates ${{ needs.guard.outputs.version }} to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
