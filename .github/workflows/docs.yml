name: Docs

# The documentation site (docs/design/docs-site.md): Astro Starlight over docs/, deployed to GitHub Pages only with a
# release: after a successful publish.yml run it builds the released commit, so the live docs and the version in the
# site title match the latest release (merges to main do not deploy). Pull requests that touch the docs only build it
# (no deploy), so a page that breaks the build fails before it merges; path filters keep it off every other change
# (Actions minutes).
on:
  pull_request:
    paths:
      - "docs/**"
      - "docs-site/**"
      - "MainframeEngine/Content/UI/fonts/**"
      - ".github/workflows/docs.yml"
  workflow_run: # the deploy: after a successful release, the released commit (its new tag is the version in the title)
    workflows: [publish]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual redeploy from main (e.g. after a failed post-release deploy): gh workflow run docs.yml

concurrency:
  # Pull request builds cancel older ones; a deploy from main finishes before the next one starts.
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The docs' PNG screenshots are Git LFS objects; fetch only docs/images, cached by object ID. Full history and
      # tags: the site title shows the latest release tag reachable from this commit (git describe).
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
          # After a release, the commit the release was built from (a workflow_run otherwise checks out main's tip).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: List LFS objects
        run: git lfs ls-files -l --include="docs/images/**" --exclude="*.ico" | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-docs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-docs-

      - name: Fetch LFS objects
        run: git lfs pull --include="docs/images/**" --exclude="*.ico"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install
        working-directory: docs-site
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: docs-site
        run: npm run build

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
