<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<title>Neon Demo</title>
<!-- Simplified artwork (48 px and below): towers, the ring and the sign, no windows. -->
<defs>
<clipPath id="tile"><rect width="100" height="100" rx="22"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0620"/><stop offset="0.55" stop-color="#2A0B4A"/><stop offset="0.85" stop-color="#8E1A6E"/><stop offset="1" stop-color="#FF3EA5"/></linearGradient>
<radialGradient id="glow" cx="50" cy="96" r="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF5FB8" stop-opacity="0.85"/><stop offset="0.5" stop-color="#7B2CFF" stop-opacity="0.35"/><stop offset="1" stop-color="#7B2CFF" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#tile)">
<rect width="100" height="100" fill="url(#sky)"/>
<rect width="100" height="100" fill="url(#glow)"/>
<circle cx="50" cy="38" r="24" fill="none" stroke="#2FF3FF" stroke-width="4" opacity="0.9"/>
<rect x="6" y="52" width="14" height="48" fill="#07040F"/>
<rect x="18" y="30" width="12" height="70" fill="#07040F"/>
<rect x="29" y="40" width="10" height="60" fill="#07040F"/>
<rect x="38" y="18" width="14" height="82" fill="#07040F"/>
<rect x="52" y="36" width="11" height="64" fill="#07040F"/>
<rect x="62" y="24" width="13" height="76" fill="#07040F"/>
<rect x="74" y="44" width="10" height="56" fill="#07040F"/>
<rect x="83" y="34" width="13" height="66" fill="#07040F"/>
<rect x="40" y="24" width="5" height="30" rx="1.5" fill="#FF3EA5"/>
</g>
</svg>
