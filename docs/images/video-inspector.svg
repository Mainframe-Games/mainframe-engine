<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Video inspector (proposal)</title>
  <desc>The inspector of a VideoStream (a .webm file selected in the FileSystem panel): a 16:9 preview with icon-button transport (play/pause, stop, loop, mute), a scrubber with time, a probe line (size, frame rate, codecs, file size), the import settings from the .meta sidecar, and decode statistics while previewing. The FileSystem shows a first-frame thumbnail on hover.</desc>
  <rect width="980" height="600" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:13px;fill:#e8ebf2}
    .sec{font-weight:600;font-size:11.5px;fill:#e8ebf2}
    .t{fill:#d7dbe4;font-size:12px}
    .s{fill:#8b93a5;font-size:11px}
    .xs{fill:#8b93a5;font-size:9.5px}
    .ms{fill:#8b93a5;font-size:10px;font-family:ui-monospace, Menlo, Consolas, monospace}
    .cap{fill:#374151;font-size:12px}
    .note{fill:#1f2937;font-size:11.5px}
    .noteb{fill:#111827;font-size:11.5px;font-weight:600}
    .btn{fill:#2f333d;stroke:#3b3f4b}
    .ic{fill:none;stroke:#d7dbe4;stroke-width:1.4}
  </style>

  <!-- window -->
  <rect x="20" y="20" width="700" height="550" rx="8" fill="#1f2128" stroke="#111827"/>
  <rect x="20" y="20" width="700" height="26" rx="8" fill="#15171c"/>
  <rect x="20" y="38" width="700" height="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/>
  <circle cx="54" cy="33" r="5" fill="#f59e0b"/>
  <circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="370" y="37" class="s" text-anchor="middle">Mainframe Editor — MyGame</text>

  <!-- FileSystem -->
  <rect x="26" y="52" width="214" height="512" fill="#262931" stroke="#3b3f4b"/>
  <rect x="26" y="52" width="214" height="26" fill="#2f333d"/>
  <text x="36" y="69" class="hdr">FileSystem</text>
  <path d="M37.5,91 h4 l1.5,1.5 h5.5 v7.5 h-11 z" fill="none" stroke="#8b93a5" stroke-width="1.3"/>
  <text x="56" y="99" class="t">Content</text>
  <path d="M51.5,115 h4 l1.5,1.5 h5.5 v7.5 h-11 z" fill="none" stroke="#8b93a5" stroke-width="1.3"/>
  <text x="70" y="123" class="t">Video</text>
  <rect x="28" y="132" width="210" height="22" fill="#1d4ed8"/>
  <rect x="65" y="137" width="12" height="9" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M68,149 h6" stroke="#ffffff" stroke-width="1.2"/>
  <text x="84" y="147" class="t">intro.webm</text>
  <rect x="65" y="161" width="12" height="9" rx="1.5" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
  <path d="M68,173 h6" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="84" y="171" class="t">studio_logo.webm</text>
  <rect x="65" y="185" width="12" height="9" rx="1.5" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
  <path d="M68,197 h6" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="84" y="195" class="t">tv_loop.webm</text>
  <path d="M51.5,211 h4 l1.5,1.5 h5.5 v7.5 h-11 z" fill="none" stroke="#8b93a5" stroke-width="1.3"/>
  <text x="70" y="219" class="t">Scenes</text>
  <!-- hover thumbnail -->
  <rect x="96" y="232" width="136" height="96" rx="4" fill="#2f333d" stroke="#4b5263"/>
  <rect x="102" y="238" width="124" height="70" fill="#0b1220"/>
  <rect x="102" y="278" width="124" height="30" fill="#14321f"/>
  <circle cx="190" cy="258" r="11" fill="#f59e0b" opacity="0.85"/>
  <text x="102" y="321" class="xs">first frame · 0:12 · 1920×1080</text>
  <text x="96" y="344" class="xs">hover on studio_logo.webm</text>

  <!-- Inspector -->
  <rect x="246" y="52" width="468" height="512" fill="#262931" stroke="#3b3f4b"/>
  <rect x="246" y="52" width="468" height="26" fill="#2f333d"/>
  <text x="256" y="69" class="hdr">Inspector</text>
  <rect x="334" y="60" width="12" height="9" rx="1.5" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="352" y="69" class="s">intro.webm · VideoStream</text>

  <!-- preview -->
  <rect x="254" y="86" width="452" height="290" rx="4" fill="#1f2128" stroke="#3b3f4b"/>
  <rect x="270" y="94" width="420" height="236" fill="#000000"/>
  <rect x="270" y="94" width="420" height="160" fill="#0b1220"/>
  <rect x="270" y="254" width="420" height="76" fill="#14321f"/>
  <polygon points="270,254 360,200 450,254" fill="#1e293b"/>
  <polygon points="400,254 520,180 640,254" fill="#273449"/>
  <circle cx="600" cy="140" r="22" fill="#f59e0b" opacity="0.9"/>
  <text x="680" y="108" class="ms" text-anchor="end">frame 126</text>

  <!-- transport -->
  <rect x="262" y="338" width="24" height="22" rx="3" fill="#2563eb" stroke="#3b82f6"/>
  <rect x="269" y="343" width="3" height="12" fill="#ffffff"/>
  <rect x="276" y="343" width="3" height="12" fill="#ffffff"/>
  <rect x="290" y="338" width="24" height="22" rx="3" class="btn"/>
  <rect x="297" y="344" width="10" height="10" rx="1" fill="#d7dbe4"/>
  <rect x="318" y="338" width="24" height="22" rx="3" fill="#1d4ed8" stroke="#3b82f6"/>
  <path d="M324,346 h10 l-2,-2 M336,352 h-10 l2,2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <rect x="346" y="338" width="24" height="22" rx="3" class="btn"/>
  <polygon points="352,346 355,346 359,342 359,356 355,352 352,352" fill="#d7dbe4"/>
  <path d="M362,345.5 a4,4 0 0 1 0,7" class="ic"/>
  <rect x="394" y="347" width="200" height="4" rx="2" fill="#121418"/>
  <rect x="394" y="347" width="70" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="464" cy="349" r="6" fill="#d7dbe4"/>
  <text x="698" y="353" class="ms" text-anchor="end">0:04.20 / 0:12.00</text>
  <text x="272" y="372" class="ms">1920×1080 · 30 fps · AV1 4:2:0 · BT.709 · Opus 48 kHz · 8.4 MB</text>

  <!-- import settings -->
  <rect x="254" y="384" width="452" height="22" fill="#2f333d"/>
  <text x="262" y="399" class="sec">Import (.meta)</text>
  <text x="270" y="424" class="t">Loop</text>
  <rect x="470" y="412" width="14" height="14" rx="2" fill="#121418" stroke="#4b5263"/>
  <text x="270" y="448" class="t">Color space</text>
  <rect x="470" y="436" width="228" height="20" rx="3" fill="#121418" stroke="#2f333d"/>
  <text x="478" y="450" class="t">Auto (from stream)</text>
  <text x="270" y="472" class="t">Audio bus</text>
  <rect x="470" y="460" width="228" height="20" rx="3" fill="#121418" stroke="#2f333d"/>
  <text x="478" y="474" class="t">Music</text>
  <text x="270" y="496" class="t">Mipmaps</text>
  <rect x="470" y="484" width="14" height="14" rx="2" fill="#121418" stroke="#4b5263"/>

  <!-- stats -->
  <rect x="254" y="510" width="452" height="22" fill="#2f333d"/>
  <text x="262" y="525" class="sec">Preview statistics</text>
  <text x="270" y="550" class="ms">decode 2.1 ms/frame · queue 4/4 · dropped 0 · A/V offset +3 ms</text>

  <!-- callouts -->
  <circle cx="694" cy="94" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="694" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">1</text>
  <circle cx="745" cy="100" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="745" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">1</text>
  <text x="762" y="104" class="noteb">Preview</text>
  <text x="762" y="119" class="note">VideoTexture in the panel,</text>
  <text x="762" y="134" class="note">aspect kept, letterboxed</text>

  <circle cx="382" cy="349" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="382" y="353" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">2</text>
  <circle cx="745" cy="180" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="745" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">2</text>
  <text x="762" y="184" class="noteb">Transport (icon buttons)</text>
  <text x="762" y="199" class="note">play/pause, stop, loop, mute;</text>
  <text x="762" y="214" class="note">scrub seeks (keyframe while</text>
  <text x="762" y="229" class="note">dragging, exact on release)</text>

  <circle cx="258" cy="368" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="258" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">3</text>
  <circle cx="745" cy="270" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="745" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">3</text>
  <text x="762" y="274" class="noteb">Probe line</text>
  <text x="762" y="289" class="note">read from the container;</text>
  <text x="762" y="304" class="note">unsupported codecs show</text>
  <text x="762" y="319" class="note">an import-error badge</text>

  <circle cx="694" cy="399" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="694" y="403" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">4</text>
  <circle cx="745" cy="360" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="745" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">4</text>
  <text x="762" y="364" class="noteb">Import settings</text>
  <text x="762" y="379" class="note">edit the .meta sidecar,</text>
  <text x="762" y="394" class="note">one undo entry each</text>

  <circle cx="694" cy="525" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="694" y="529" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">5</text>
  <circle cx="745" cy="440" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="745" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">5</text>
  <text x="762" y="444" class="noteb">Statistics</text>
  <text x="762" y="459" class="note">VideoPlaybackStats while</text>
  <text x="762" y="474" class="note">the preview plays</text>

  <circle cx="232" cy="236" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="232" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">6</text>
  <circle cx="745" cy="510" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="745" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">6</text>
  <text x="762" y="514" class="noteb">FileSystem thumbnails</text>
  <text x="762" y="529" class="note">first frame, cached by</text>
  <text x="762" y="544" class="note">ThumbnailCache; icon device-tv</text>

  <text x="20" y="592" class="cap">Proposal mockup — sizes and spacing indicative. Every action is an icon button with a tooltip (editor convention).</text>
</svg>
