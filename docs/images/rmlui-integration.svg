<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>RmlUi integration</title>
  <desc>Layers of the planned RmlUi integration: C# UiServer and nodes, the engine-owned C ABI shim, RmlUi core with FreeType, and the C# Vulkan render interface recording into the engine's command buffer. Also shows input routing and the premultiplied vertex format.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:14px;fill:#111827}
    .t{fill:#1f2937}
    .s{fill:#4b5563;font-size:11.5px}
    .m{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:11px;fill:#1f2937}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>

  <!-- Managed -->
  <rect x="20" y="20" width="560" height="200" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="36" y="44" class="hdr">C# — MainframeEngine (managed)</text>
  <rect x="36" y="56" width="160" height="70" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="46" y="78" class="t">UiLayer / UiDocument</text>
  <text x="46" y="96" class="s">nodes in the SceneTree</text>
  <text x="46" y="112" class="s">data models, events</text>
  <rect x="210" y="56" width="160" height="70" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="220" y="78" class="t">UiServer</text>
  <text x="220" y="96" class="s">contexts per layer</text>
  <text x="220" y="112" class="s">input routing · HiDPI</text>
  <rect x="384" y="56" width="180" height="70" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="394" y="78" class="t">Rml managed API</text>
  <text x="394" y="96" class="s">LibraryImport, SafeHandle</text>
  <text x="394" y="112" class="s">UTF-8 marshalling</text>
  <rect x="36" y="140" width="250" height="66" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="46" y="162" class="t">VulkanUiRenderer (RenderInterface)</text>
  <text x="46" y="180" class="s">geometry arena · textures (premultiplied)</text>
  <text x="46" y="196" class="s">scissor · transform · v2: stencil, layers</text>
  <rect x="300" y="140" width="264" height="66" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="310" y="162" class="t">System / File interfaces</text>
  <text x="310" y="180" class="s">time · Log · SDL cursor/clipboard/IME</text>
  <text x="310" y="196" class="s">TranslateString → Tr · ContentPaths</text>

  <!-- Native shim -->
  <rect x="20" y="250" width="560" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="36" y="274" class="hdr">MainframeEngine.RmlUi.Native — C ABI shim (engine-owned)</text>
  <text x="36" y="294" class="s">rml_* functions · opaque handles · interfaces passed as structs of function pointers</text>
  <text x="36" y="312" class="s">forked from PourrezJ RmlUiNative → RmlUi 6.3 · built per RID: win-x64, linux-x64, osx universal</text>

  <!-- RmlUi core -->
  <rect x="20" y="360" width="560" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="36" y="384" class="hdr">RmlUi 6.3 Core + Debugger (static) · FreeType (static, FTL)</text>
  <text x="36" y="404" class="s">RML/RCSS parsing · layout · data bindings · animations · font atlases</text>
  <text x="36" y="420" class="s">context.Update() / Render() → calls RenderInterface</text>

  <!-- arrows between layers -->
  <line x1="474" y1="128" x2="474" y2="248" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="480" y="236" class="s">P/Invoke</text>
  <line x1="160" y1="248" x2="160" y2="208" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="166" y="236" class="s">callbacks [UnmanagedCallersOnly]</text>
  <line x1="300" y1="332" x2="300" y2="358" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="320" y1="358" x2="320" y2="332" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Vulkan -->
  <rect x="610" y="20" width="330" height="200" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="626" y="44" class="hdr">Engine Vulkan (same device)</text>
  <text x="626" y="66" class="s">v1: inside main render pass, after scene,</text>
  <text x="626" y="82" class="s">     before the overlays, depth off</text>
  <text x="626" y="102" class="s">v2: own UI pass after tonemap,</text>
  <text x="626" y="118" class="s">     + stencil (clip masks) + layer targets</text>
  <text x="626" y="142" class="t">Pipeline</text>
  <text x="626" y="160" class="s">blend ONE / ONE_MINUS_SRC_ALPHA (premultiplied)</text>
  <text x="626" y="176" class="s">ortho pixels, origin top-left, no Y-flip</text>
  <text x="626" y="192" class="s">push: mat4 transform + vec2 translation</text>
  <text x="626" y="208" class="s">ported from RmlUi_Renderer_VK (MIT)</text>
  <path d="M160,140 L160,133 L606,133" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="176" y="130" class="s" font-size="10.5">records into engine command buffer</text>

  <!-- vertex -->
  <rect x="610" y="240" width="330" height="90" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="626" y="262" class="hdr">Rml::Vertex (20 B)</text>
  <rect x="626" y="274" width="128" height="26" fill="#bfdbfe" stroke="#374151"/>
  <rect x="754" y="274" width="64" height="26" fill="#fde68a" stroke="#374151"/>
  <rect x="818" y="274" width="108" height="26" fill="#bbf7d0" stroke="#374151"/>
  <text x="632" y="292" class="m">vec2 position</text>
  <text x="758" y="292" class="m">RGBA8 PM</text>
  <text x="822" y="292" class="m">vec2 uv</text>
  <text x="626" y="318" class="s">0</text><text x="750" y="318" class="s">8</text><text x="812" y="318" class="s">12</text><text x="916" y="318" class="s">20</text>

  <!-- input -->
  <rect x="610" y="350" width="330" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="626" y="372" class="hdr">Input routing</text>
  <text x="626" y="394" class="s">SDL event → InputEvent → UiLayers (top → bottom)</text>
  <text x="626" y="412" class="s">context.ProcessMouseMove/Button/Wheel/Key/Text</text>
  <text x="626" y="432" class="t" fill="#b91c1c">returns TRUE when NOT consumed ⚠</text>
  <text x="626" y="452" class="s">UiServer wraps it as bool consumed</text>
  <text x="626" y="470" class="s">not consumed → Node.OnInput / OnUnhandledInput</text>
  <text x="626" y="488" class="s">gamepad D-pad/A/B → nav keys / Enter / Escape</text>

  <text x="20" y="470" class="s">Editor reuses the same stack: its panels are UiDocuments; the viewport is an engine render</text>
  <text x="20" y="488" class="s">target exposed to RmlUi through the engine:// texture scheme.</text>
</svg>
