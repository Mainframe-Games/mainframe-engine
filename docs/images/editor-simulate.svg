<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Editor Simulate mode (proposal G7.5)</title>
  <desc>The editor while a scene simulates: the toolbar's Simulate button is amber and acts as Stop (tooltip "Stop Simulation (Alt+F6)"), with Pause next to it; the viewport has an amber frame and a banner with Keep Transforms and Stop icon buttons; crates fall in the simulated copy; the inspector shows the selected crate's live values read-only; Output reports a caught game exception.</desc>
  <rect width="960" height="620" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:13px;fill:#e5e7eb}
    .t{fill:#d1d5db;font-size:12px}
    .s{fill:#9ca3af;font-size:11px}
    .m{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:11px;fill:#d1d5db}
    .cap{fill:#374151;font-size:12px}
    .leg{fill:#1f2937;font-size:12px}
    .badge{fill:#1d4ed8}
    .bt{fill:#ffffff;font-size:11px;font-weight:700}
    .cf{fill:#c7a574}
    .ct{fill:#dcc093}
    .cs{fill:#a7855a}
  </style>
  <defs>
    <g id="crate">
      <rect x="-20" y="-20" width="40" height="40" class="cf"/>
      <polygon points="-20,-20 -10,-30 30,-30 20,-20" class="ct"/>
      <polygon points="20,-20 30,-30 30,10 20,20" class="cs"/>
    </g>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="920" height="440" rx="8" fill="#1f2128" stroke="#111827"/>
  <rect x="20" y="20" width="920" height="26" rx="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/><circle cx="54" cy="33" r="5" fill="#f59e0b"/><circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="380" y="38" class="s">Mainframe Engine — MyGame — physics_3d.mscene</text>

  <!-- toolbar -->
  <rect x="20" y="46" width="920" height="30" fill="#2a2d36"/>
  <g opacity="0.45">
    <rect x="32" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="38" y="65" class="t">↖</text>
    <rect x="58" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="63" y="65" class="t">✥</text>
    <rect x="84" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="89" y="65" class="t">⟳</text>
    <rect x="110" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="115" y="65" class="t">⤢</text>
  </g>
  <g>
    <rect x="420" y="52" width="22" height="18" rx="3" fill="#166534"/><text x="427" y="65" class="t">▶</text>
    <rect x="446" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="451" y="65" class="t">▣</text>
    <rect x="472" y="52" width="22" height="18" rx="3" fill="#3b3f4b" opacity="0.45"/><text x="478" y="65" class="t" opacity="0.45">⏸</text>
    <rect x="498" y="52" width="22" height="18" rx="3" fill="#3b3f4b" opacity="0.45"/><text x="504" y="65" class="t" opacity="0.45">⏹</text>
    <rect x="524" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="529" y="65" class="t">⚒</text>
    <!-- new: simulate (running = amber, acts as stop) + pause simulation -->
    <line x1="556" y1="54" x2="556" y2="70" stroke="#4b5563"/>
    <rect x="566" y="52" width="22" height="18" rx="3" fill="#b45309" stroke="#fbbf24"/>
    <ellipse cx="577" cy="61" rx="7" ry="2.6" fill="none" stroke="#fff7ed" stroke-width="1"/>
    <ellipse cx="577" cy="61" rx="7" ry="2.6" fill="none" stroke="#fff7ed" stroke-width="1" transform="rotate(60 577 61)"/>
    <ellipse cx="577" cy="61" rx="7" ry="2.6" fill="none" stroke="#fff7ed" stroke-width="1" transform="rotate(-60 577 61)"/>
    <circle cx="577" cy="61" r="1.3" fill="#fff7ed"/>
    <rect x="592" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="598" y="65" class="t">⏸</text>
  </g>
  <!-- scene panel -->
  <rect x="24" y="80" width="170" height="276" fill="#262931" stroke="#3b3f4b"/>
  <text x="34" y="98" class="hdr">Scene</text>
  <g class="t">
    <text x="34" y="124">▾ ◇ Physics3D</text>
    <text x="50" y="146">☀ Sun</text>
    <text x="50" y="168">▭ Floor</text>
    <text x="50" y="190">⬡ Crate</text>
    <rect x="44" y="198" width="146" height="20" fill="#1d4ed8" opacity="0.8"/>
    <text x="50" y="212">⬡ Crate2</text>
    <text x="50" y="234">⬡ Crate3</text>
    <text x="50" y="256">● Ball</text>
  </g>

  <!-- viewport: simulated copy -->
  <rect x="198" y="80" width="460" height="276" fill="#20232a" stroke="#3b3f4b"/>
  <rect x="198" y="80" width="130" height="22" fill="#2f333d"/><text x="208" y="96" class="t">physics_3d.mscene</text>
  <rect x="202" y="104" width="452" height="248" fill="#33475a" stroke="#f59e0b" stroke-width="2"/>
  <!-- banner -->
  <rect x="202" y="104" width="452" height="26" fill="#78350f" fill-opacity="0.92"/>
  <circle cx="214" cy="117" r="4" fill="#fbbf24"/>
  <text x="224" y="121" class="t">Simulating — physics and scripts run in a copy; edits are off</text>
  <rect x="604" y="108" width="20" height="18" rx="3" fill="#92400e" stroke="#fbbf24" stroke-opacity="0.6"/><text x="608" y="121" class="t">▤</text>
  <rect x="628" y="108" width="20" height="18" rx="3" fill="#92400e" stroke="#fbbf24" stroke-opacity="0.6"/><text x="632" y="121" class="t">⏹</text>
  <!-- floor + falling crates -->
  <g stroke="#4d6577"><line x1="202" y1="300" x2="654" y2="300"/><line x1="202" y1="326" x2="654" y2="326"/><line x1="290" y1="288" x2="260" y2="352"/><line x1="420" y1="288" x2="420" y2="352"/><line x1="550" y1="288" x2="580" y2="352"/></g>
  <use href="#crate" x="330" y="270"/>
  <g transform="rotate(18 430 190)"><use href="#crate" x="430" y="190"/></g>
  <polygon points="406,166 418,154 460,160 458,212 446,224 404,218" fill="none" stroke="#f59e0b" stroke-width="2" transform="rotate(18 430 190)"/>
  <g stroke="#e5e7eb" stroke-opacity="0.5"><line x1="420" y1="150" x2="420" y2="138"/><line x1="440" y1="150" x2="440" y2="134"/><line x1="460" y1="156" x2="460" y2="142"/></g>
  <g transform="rotate(-25 520 240)"><use href="#crate" x="520" y="240"/></g>
  <circle cx="580" cy="282" r="13" fill="#93c5fd"/>
  <text x="214" y="344" class="s">◰ Perspective · editor camera</text>

  <!-- inspector: live, read-only -->
  <rect x="662" y="80" width="274" height="276" fill="#262931" stroke="#3b3f4b"/>
  <text x="674" y="98" class="hdr">Inspector</text>
  <rect x="670" y="106" width="258" height="22" rx="3" fill="#78350f" fill-opacity="0.8"/>
  <circle cx="680" cy="117" r="3.5" fill="#fbbf24"/>
  <text x="690" y="121" class="s" fill="#fde68a">Simulating — values are live and read-only</text>
  <text x="674" y="148" class="t">⬡ Crate2 : RigidBody3D</text>
  <text x="674" y="172" class="s">▾ Node3D</text>
  <text x="684" y="194" class="t">Position</text>
  <g opacity="0.75">
    <rect x="752" y="182" width="56" height="16" rx="2" fill="#30343e"/><rect x="812" y="182" width="56" height="16" rx="2" fill="#30343e"/><rect x="872" y="182" width="56" height="16" rx="2" fill="#30343e"/>
    <text x="758" y="194" class="s">0.82</text><text x="818" y="194" class="s">3.41</text><text x="878" y="194" class="s">-0.10</text>
  </g>
  <text x="684" y="218" class="t">Rotation</text>
  <g opacity="0.75">
    <rect x="752" y="206" width="56" height="16" rx="2" fill="#30343e"/><rect x="812" y="206" width="56" height="16" rx="2" fill="#30343e"/><rect x="872" y="206" width="56" height="16" rx="2" fill="#30343e"/>
    <text x="758" y="218" class="s">0.0</text><text x="818" y="218" class="s">0.0</text><text x="878" y="218" class="s">18.0</text>
  </g>
  <text x="674" y="244" class="s">▾ RigidBody3D</text>
  <text x="684" y="266" class="t">Mass</text>
  <rect x="752" y="254" width="176" height="16" rx="2" fill="#30343e" opacity="0.75"/><text x="758" y="266" class="s">1.0</text>
  <text x="684" y="290" class="t">Linear Velocity</text>
  <rect x="790" y="278" width="138" height="16" rx="2" fill="#30343e" opacity="0.75"/><text x="796" y="290" class="s">0.0, -4.9, 0.0</text>

  <!-- output -->
  <rect x="24" y="360" width="912" height="96" fill="#262931" stroke="#3b3f4b"/>
  <text x="34" y="378" class="hdr">Output</text>
  <text x="34" y="400" class="m">[12:04:10.031] [INFO] Simulating physics_3d.mscene (game code from the 12:01 build)</text>
  <text x="34" y="418" class="m">[12:04:12.880] [WARN] Simulation: Content/Materials/Crate.mres changed (shared with the scene)</text>
  <text x="34" y="436" class="m" fill="#fca5a5">[12:04:13.517] [ERROR] Spawner.cs:31 NullReferenceException in /Physics3D/Spawner.OnProcess; simulation stopped</text>

  <!-- badges -->
  <circle cx="628" cy="61" r="9" class="badge"/><text x="624.5" y="65" class="bt">1</text>
  <circle cx="214" cy="146" r="9" class="badge"/><text x="210.5" y="150" class="bt">2</text>
  <circle cx="614" cy="142" r="9" class="badge"/><text x="610.5" y="146" class="bt">3</text>
  <circle cx="920" cy="150" r="9" class="badge"/><text x="916.5" y="154" class="bt">4</text>
  <circle cx="920" cy="400" r="9" class="badge"/><text x="916.5" y="404" class="bt">5</text>

  <!-- legend -->
  <g>
    <circle cx="34" cy="482" r="8" class="badge"/><text x="31" y="486" class="bt">1</text>
    <text x="50" y="486" class="leg">Simulate (atom icon, Alt+F6) turns amber while running and stops the simulation; Pause sits next to it. Play keeps working.</text>
    <circle cx="34" cy="506" r="8" class="badge"/><text x="31" y="510" class="bt">2</text>
    <text x="50" y="510" class="leg">The view shows a simulated copy in its own world (PackedScene.Pack → Instantiate). Stop frees it; the authored scene is untouched.</text>
    <circle cx="34" cy="530" r="8" class="badge"/><text x="31" y="534" class="bt">3</text>
    <text x="50" y="534" class="leg">Banner icon buttons: Keep Transforms (stop and copy the selected nodes' simulated position and rotation, one undo step) and Stop.</text>
    <circle cx="34" cy="554" r="8" class="badge"/><text x="31" y="558" class="bt">4</text>
    <text x="50" y="558" class="leg">The inspector shows the simulated counterpart of the selected node, live and read-only. Gizmo, handles and edits are off.</text>
    <circle cx="34" cy="578" r="8" class="badge"/><text x="31" y="582" class="bt">5</text>
    <text x="50" y="582" class="leg">Exceptions in simulated callbacks are caught and logged with file and line, and the simulation stops; changed shared files are listed.</text>
  </g>
  <text x="20" y="608" class="cap">No input, audio, networking, Steam or autoloads in Simulate: Play (out of process) runs the game as players get it.</text>
</svg>
