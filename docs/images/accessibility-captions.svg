<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Captions and accessibility settings (G14 proposal)</title>
  <desc>Left: a first-person game frame with the engine's caption layer at the bottom centre: a directional sound caption with an arrow towards the source, a dialogue subtitle with the speaker's name in the speaker's colour, and a second sound caption, each on its own translucent background. Below it, the four caption sizes and three background opacities the player can choose. Right: the Accessibility tab of the drop-in settings menu with Vision, Hearing, Motion and Input groups.</desc>
  <rect width="960" height="700" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:13px;fill:#ffffff}
    .grp{fill:#8a95ab;font-size:10.5px;font-weight:600;letter-spacing:1px}
    .t{fill:#e6e9ef;font-size:12px}
    .s{fill:#8a95ab;font-size:11px}
    .tab{fill:#8a95ab;font-size:12px}
    .tabon{fill:#ffffff;font-size:12px;font-weight:600}
    .doc{fill:#93c5fd;font-size:10.5px;font-family:ui-monospace, Menlo, Consolas, monospace}
    .cap{fill:#374151;font-size:12px}
    .btn{fill:#2b3445;stroke:#44506a}
    .pri{fill:#2f6fd6;stroke:#5aa0ff}
    .field{fill:#0b0e14;stroke:#44506a}
    .track{fill:#0b0e14}
    .prog{fill:#3d8bfd}
    .knob{fill:#e6e9ef}
    .on{fill:#3d8bfd;stroke:#3d8bfd}
    .off{fill:#0b0e14;stroke:#44506a}
    .sub{fill:#ffffff}
    .sfx{fill:#e6e9ef;font-style:italic}
  </style>

  <!-- ===================== Game window ===================== -->
  <rect x="20" y="20" width="580" height="400" rx="8" fill="#1f2128" stroke="#111827"/>
  <rect x="20" y="20" width="580" height="26" rx="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/><circle cx="54" cy="33" r="5" fill="#f59e0b"/><circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="250" y="38" fill="#9ca3af" font-size="11">Forest Demo</text>

  <!-- scene: sky, hills, trees, stream -->
  <rect x="20" y="46" width="580" height="374" fill="#7f9fb8"/>
  <path d="M20 230 Q150 180 300 215 T600 200 V420 H20 Z" fill="#4d6b45"/>
  <path d="M20 270 Q200 240 360 262 T600 250 V420 H20 Z" fill="#3d5a3a"/>
  <path d="M250 420 C280 360 330 320 300 270 L318 268 C350 320 320 370 330 420 Z" fill="#4b7fa3"/>
  <g fill="#24402a">
    <path d="M60 270 L85 170 L110 270 Z"/><path d="M110 262 L130 190 L150 262 Z"/>
    <path d="M440 262 L468 160 L496 262 Z"/><path d="M500 258 L520 195 L540 258 Z"/><path d="M545 266 L568 180 L591 266 Z"/>
  </g>
  <text x="34" y="66" class="doc">CaptionLayer (layer 85) · Content/UI/captions/captions.rml</text>

  <!-- caption stack, bottom centre, oldest on top -->
  <rect x="216" y="306" width="188" height="24" rx="3" fill="#000000" opacity="0.75"/>
  <text x="226" y="323" class="sfx" font-size="14">◀  [birds singing, left]</text>

  <rect x="148" y="336" width="326" height="24" rx="3" fill="#000000" opacity="0.75"/>
  <text x="158" y="353" font-size="14"><tspan fill="#f2c14e" font-weight="600">MAREN:</tspan><tspan class="sub">&#160;The stream's this way. Follow the birds.</tspan></text>

  <rect x="226" y="366" width="168" height="24" rx="3" fill="#000000" opacity="0.75"/>
  <text x="236" y="383" class="sfx" font-size="14">[footsteps on gravel]</text>

  <!-- annotations inside the frame -->
  <line x1="214" y1="318" x2="150" y2="292" stroke="#93c5fd" stroke-dasharray="3 2"/>
  <text x="34" y="288" class="doc">direction from the listener</text>
  <line x1="476" y1="346" x2="530" y2="320" stroke="#93c5fd" stroke-dasharray="3 2"/>
  <text x="470" y="314" class="doc">SpeakerTable colour</text>

  <!-- ===================== Size and background options ===================== -->
  <text x="20" y="450" class="cap" font-weight="600">Caption size (dp at the 1080p reference)</text>
  <rect x="20" y="462" width="580" height="78" rx="6" fill="#1c2333"/>
  <rect x="32" y="490" width="92" height="20" rx="3" fill="#000000" opacity="0.75"/>
  <text x="40" y="504" class="sub" font-size="11">[door creaks]</text>
  <text x="32" y="530" class="s">Small · 32</text>
  <rect x="148" y="487" width="112" height="25" rx="3" fill="#000000" opacity="0.75"/>
  <text x="156" y="504" class="sub" font-size="13.5">[door creaks]</text>
  <text x="148" y="530" class="s">Medium · 40 (default)</text>
  <rect x="296" y="484" width="134" height="30" rx="3" fill="#000000" opacity="0.75"/>
  <text x="304" y="505" class="sub" font-size="16.5">[door creaks]</text>
  <text x="296" y="530" class="s">Large · 50</text>
  <rect x="446" y="480" width="146" height="36" rx="3" fill="#000000" opacity="0.75"/>
  <text x="452" y="505" class="sub" font-size="20">[door creaks]</text>
  <text x="446" y="530" class="s">Extra large · 64</text>

  <text x="20" y="570" class="cap" font-weight="600">Background opacity</text>
  <rect x="20" y="582" width="580" height="58" rx="6" fill="#4d6b45"/>
  <text x="40" y="616" class="sub" font-size="13.5">[thunder, distant]</text>
  <text x="40" y="632" fill="#e6e9ef" font-size="10">0 % (outline only)</text>
  <rect x="226" y="599" width="140" height="25" rx="3" fill="#000000" opacity="0.5"/>
  <text x="234" y="616" class="sub" font-size="13.5">[thunder, distant]</text>
  <text x="226" y="636" fill="#e6e9ef" font-size="10">50 %</text>
  <rect x="420" y="599" width="140" height="25" rx="3" fill="#000000" opacity="0.75"/>
  <text x="428" y="616" class="sub" font-size="13.5">[thunder, distant]</text>
  <text x="420" y="636" fill="#e6e9ef" font-size="10">75 % (default)</text>

  <!-- ===================== Settings: Accessibility tab ===================== -->
  <rect x="620" y="20" width="320" height="640" rx="6" fill="#121722" stroke="#2e3850"/>
  <rect x="621" y="21" width="318" height="30" fill="#1c2333"/>
  <text x="632" y="41" class="hdr">Settings</text>
  <rect x="910" y="26" width="22" height="20" rx="3" class="btn"/><text x="916" y="41" class="t">✕</text>
  <text x="634" y="74" class="tab">Audio</text>
  <text x="682" y="74" class="tab">Controls</text>
  <text x="746" y="74" class="tab">Display</text>
  <rect x="806" y="58" width="104" height="24" fill="#1c2333"/><text x="816" y="74" class="tabon">Accessibility</text>
  <rect x="806" y="80" width="104" height="2" fill="#3d8bfd"/>
  <line x1="628" y1="83" x2="932" y2="83" stroke="#2e3850"/>

  <!-- VISION -->
  <text x="636" y="106" class="grp">VISION</text>
  <text x="636" y="128" class="t">UI scale</text>
  <rect x="790" y="120" width="100" height="6" rx="3" class="track"/><rect x="790" y="120" width="50" height="6" rx="3" class="prog"/>
  <rect x="836" y="115" width="10" height="16" rx="3" class="knob"/><text x="896" y="128" class="s">125%</text>
  <text x="636" y="152" class="t">Text size</text>
  <rect x="790" y="139" width="138" height="20" rx="3" class="field"/><text x="798" y="153" class="t">150 %</text><text x="914" y="153" class="s">▾</text>
  <text x="636" y="176" class="t">High contrast</text>
  <rect x="912" y="164" width="16" height="16" rx="3" class="off"/>
  <text x="636" y="200" class="t">Colour filter</text>
  <rect x="790" y="187" width="138" height="20" rx="3" class="field"/><text x="798" y="201" class="t">Deuteranopia</text><text x="914" y="201" class="s">▾</text>
  <text x="636" y="224" class="t">Filter mode</text>
  <rect x="790" y="211" width="138" height="20" rx="3" class="field"/><text x="798" y="225" class="t">Correct</text><text x="914" y="225" class="s">▾</text>
  <text x="636" y="248" class="t">Filter strength</text>
  <rect x="790" y="240" width="100" height="6" rx="3" class="track"/><rect x="790" y="240" width="80" height="6" rx="3" class="prog"/>
  <rect x="866" y="235" width="10" height="16" rx="3" class="knob"/><text x="896" y="248" class="s">80%</text>

  <!-- HEARING -->
  <text x="636" y="280" class="grp">HEARING</text>
  <text x="636" y="302" class="t">Subtitles</text>
  <rect x="912" y="290" width="16" height="16" rx="3" class="on"/><path d="M915 298 l3 3 l6 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="636" y="326" class="t">Sound captions</text>
  <rect x="912" y="314" width="16" height="16" rx="3" class="on"/><path d="M915 322 l3 3 l6 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="636" y="350" class="t">Caption size</text>
  <rect x="790" y="337" width="138" height="20" rx="3" class="field"/><text x="798" y="351" class="t">Large</text><text x="914" y="351" class="s">▾</text>
  <text x="636" y="374" class="t">Caption background</text>
  <rect x="790" y="366" width="100" height="6" rx="3" class="track"/><rect x="790" y="366" width="75" height="6" rx="3" class="prog"/>
  <rect x="860" y="361" width="10" height="16" rx="3" class="knob"/><text x="896" y="374" class="s">75%</text>
  <text x="636" y="398" class="t">Speaker names and colours</text>
  <rect x="912" y="386" width="16" height="16" rx="3" class="on"/><path d="M915 394 l3 3 l6 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="636" y="422" class="t">Mono audio</text>
  <rect x="912" y="410" width="16" height="16" rx="3" class="off"/>

  <!-- MOTION -->
  <text x="636" y="454" class="grp">MOTION AND COMFORT</text>
  <text x="636" y="476" class="t">Camera shake</text>
  <rect x="790" y="468" width="100" height="6" rx="3" class="track"/><rect x="790" y="468" width="25" height="6" rx="3" class="prog"/>
  <rect x="810" y="463" width="10" height="16" rx="3" class="knob"/><text x="896" y="476" class="s">25%</text>
  <text x="636" y="500" class="t">Head bob</text>
  <rect x="912" y="488" width="16" height="16" rx="3" class="off"/>
  <text x="636" y="524" class="t">Depth of field</text>
  <rect x="912" y="512" width="16" height="16" rx="3" class="off"/>
  <text x="636" y="548" class="t">Film effects (grain, vignette, fringes)</text>
  <rect x="912" y="536" width="16" height="16" rx="3" class="off"/>
  <text x="636" y="572" class="t">Reduce UI motion</text>
  <rect x="912" y="560" width="16" height="16" rx="3" class="on"/><path d="M915 568 l3 3 l6 -7" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- INPUT -->
  <text x="636" y="604" class="grp">INPUT</text>
  <text x="636" y="626" class="t">Timing windows</text>
  <rect x="790" y="618" width="100" height="6" rx="3" class="track"/><rect x="790" y="618" width="50" height="6" rx="3" class="prog"/>
  <rect x="836" y="613" width="10" height="16" rx="3" class="knob"/><text x="896" y="626" class="s">×1.5</text>
  <rect x="636" y="636" width="90" height="18" rx="3" class="btn"/><text x="646" y="649" class="s">Reset section</text>
  <rect x="868" y="636" width="60" height="18" rx="3" class="pri"/><text x="884" y="649" class="t" font-size="11">Done</text>

  <!-- caption -->
  <text x="20" y="685" class="cap">Caption layer over a game frame (directional sound caption, coloured speaker), size and background options, and the Accessibility tab.</text>
</svg>
