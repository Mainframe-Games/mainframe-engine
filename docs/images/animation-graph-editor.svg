<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Animation graph tab (proposal)</title>
  <desc>The graph tab on hero_locomotion.mres. Layer tabs across the top: Base, UpperBody (override, masked) and Breathing (additive). The canvas shows the Base layer's state machine: an entry marker into Move (a 1D blend space, active and glowing, with a time bar), Jump, Fall, Land, and an Any State box with a transition to Hurt; arrows carry condition summaries. The left panel lists parameters with live controls: speed slider, grounded checkbox, jump trigger with a Fire button, aim_x and aim_y. The right panel shows the 2D blend space editor of the UpperBody layer's Aim state, with clip points, the triangulation, a draggable preview point and live weights, and a small preview of the skeleton. Numbered callouts explain the parts.</desc>
  <rect width="960" height="700" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:12.5px;fill:#e5e7eb}
    .t{fill:#d1d5db;font-size:11.5px}
    .s{fill:#9ca3af;font-size:10.5px}
    .xs{fill:#9ca3af;font-size:9.5px}
    .m{fill:#d1d5db;font-size:10.5px;font-family:ui-monospace, Menlo, Consolas, monospace}
    .cap{fill:#374151;font-size:12px}
    .num{fill:#ffffff;font-size:10.5px;font-weight:700}
    .g{fill:none;stroke:#d1d5db;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .btn{fill:#2f333d;stroke:#3b3f4b}
    .on{fill:#1d4ed8;stroke:#3b82f6}
    .fld{fill:#121418;stroke:#3b3f4b}
    .st{fill:#2f333d;stroke:#4b5160;stroke-width:1.2}
    .arr{fill:none;stroke:#9ca3af;stroke-width:1.4}
    .lab{fill:#d1d5db;font-size:9.5px;font-family:ui-monospace, Menlo, Consolas, monospace}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1b1d23"/><circle cx="10" cy="10" r="0.9" fill="#3b3f4b"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="920" height="520" rx="8" fill="#1f2128" stroke="#111827"/>
  <rect x="20" y="20" width="920" height="26" rx="8" fill="#15171c"/>
  <rect x="20" y="38" width="920" height="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/><circle cx="54" cy="33" r="5" fill="#f59e0b"/><circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="480" y="37" class="s" text-anchor="middle">Mainframe Engine — MyGame — hero_locomotion.mres</text>

  <!-- tabs -->
  <rect x="20" y="46" width="920" height="24" fill="#1a1c22"/>
  <rect x="24" y="49" width="110" height="21" rx="3" fill="#262931"/><text x="34" y="64" class="s">✦ hero.mskel</text>
  <rect x="138" y="49" width="170" height="21" rx="3" fill="#323642" stroke="#3b82f6"/><text x="148" y="64" class="t">⋔ hero_locomotion.mres</text>

  <!-- toolbar: layers + preview -->
  <rect x="20" y="70" width="920" height="32" fill="#2a2d36"/>
  <text x="30" y="90" class="s">Layers</text>
  <rect x="74" y="75" width="70" height="22" rx="3" class="on"/><text x="109" y="90" class="t" text-anchor="middle">Base</text>
  <rect x="148" y="75" width="128" height="22" rx="3" class="btn"/><text x="156" y="90" class="t">UpperBody</text><text x="222" y="90" class="xs">override ◐</text>
  <rect x="280" y="75" width="128" height="22" rx="3" class="btn"/><text x="288" y="90" class="t">Breathing</text><text x="348" y="90" class="xs">additive</text>
  <rect x="412" y="75" width="22" height="22" rx="3" class="btn"/><path d="M418,86 h10 M423,81 v10" class="g"/>
  <text x="446" y="90" class="xs">Base ▸ </text><text x="484" y="90" class="t">root machine</text>
  <rect x="640" y="75" width="150" height="22" rx="3" class="fld"/><text x="648" y="90" class="s">preview: hero.mskel ▾</text>
  <rect x="796" y="75" width="136" height="22" rx="3" class="fld"/><text x="804" y="90" class="s">debug: (editor preview) ▾</text>

  <!-- params panel -->
  <rect x="24" y="106" width="176" height="430" fill="#262931" stroke="#3b3f4b"/>
  <text x="32" y="124" class="hdr">Parameters</text>
  <rect x="160" y="112" width="22" height="18" rx="3" class="btn"/><text x="167" y="125" class="xs">+</text>
  <g class="s">
    <text x="32" y="150" class="t">speed</text><text x="150" y="150" class="xs">float</text>
    <rect x="32" y="158" width="130" height="4" rx="2" fill="#3b3f4b"/><circle cx="108" cy="160" r="6" fill="#60a5fa"/><text x="170" y="164" class="m">3.2</text>
    <text x="32" y="190" class="t">grounded</text><text x="150" y="190" class="xs">bool</text>
    <rect x="32" y="198" width="14" height="14" rx="2" class="on"/><path d="M35,205 l3,3 5,-6" stroke="#fff" fill="none" stroke-width="1.5"/>
    <text x="32" y="234" class="t">jump</text><text x="150" y="234" class="xs">trigger</text>
    <rect x="32" y="240" width="52" height="20" rx="3" class="btn"/><text x="58" y="254" class="t" text-anchor="middle">Fire</text>
    <text x="32" y="284" class="t">hurt</text><text x="150" y="284" class="xs">trigger</text>
    <rect x="32" y="290" width="52" height="20" rx="3" class="btn"/><text x="58" y="304" class="t" text-anchor="middle">Fire</text>
    <text x="32" y="334" class="t">aim_x</text><text x="150" y="334" class="xs">float</text>
    <rect x="32" y="342" width="130" height="4" rx="2" fill="#3b3f4b"/><circle cx="120" cy="344" r="6" fill="#f472b6"/><text x="170" y="348" class="m">0.6</text>
    <text x="32" y="374" class="t">aim_y</text><text x="150" y="374" class="xs">float</text>
    <rect x="32" y="382" width="130" height="4" rx="2" fill="#3b3f4b"/><circle cx="76" cy="384" r="6" fill="#f472b6"/><text x="170" y="388" class="m">-0.3</text>
  </g>
  <line x1="28" y1="406" x2="196" y2="406" stroke="#3b3f4b"/>
  <text x="32" y="426" class="hdr">Selected: Move → Jump</text>
  <g class="s">
    <text x="32" y="448">Conditions</text>
    <rect x="32" y="454" width="160" height="18" rx="3" class="fld"/><text x="38" y="467" class="m">jump  Triggered</text>
    <rect x="32" y="476" width="160" height="18" rx="3" class="fld"/><text x="38" y="489" class="m">grounded  True</text>
    <text x="32" y="512">Duration 0.10 · Exit any</text>
    <text x="32" y="528">Interrupt: Target</text>
  </g>

  <!-- canvas -->
  <rect x="204" y="106" width="452" height="430" fill="url(#dots)" stroke="#3b3f4b"/>
  <!-- entry -->
  <circle cx="232" cy="200" r="8" fill="#22c55e"/><text x="222" y="224" class="xs">entry</text>
  <path d="M240,200 L278,200" class="arr" marker-end="url(#ah)"/>
  <!-- Move (active) -->
  <rect x="282" y="172" width="130" height="56" rx="10" fill="#3b82f6" opacity="0.35" filter="url(#glow)"/>
  <rect x="282" y="172" width="130" height="56" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <path d="M294,190 h22 M298,186 v8 M312,186 v8" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="324" y="194" class="t">Move</text><text x="324" y="208" class="xs">blend 1D · speed</text>
  <rect x="294" y="216" width="106" height="4" rx="2" fill="#111827"/><rect x="294" y="216" width="62" height="4" rx="2" fill="#93c5fd"/>
  <!-- Jump -->
  <rect x="490" y="150" width="110" height="46" rx="10" class="st"/><text x="530" y="170" class="t">Jump</text><text x="530" y="184" class="xs">clip · jump</text>
  <path d="M502,164 l6,-6 6,6 M508,158 v14" class="g"/>
  <!-- Fall -->
  <rect x="490" y="250" width="110" height="46" rx="10" class="st"/><text x="530" y="270" class="t">Fall</text><text x="530" y="284" class="xs">clip · fall</text>
  <path d="M502,262 v10 l6,-6 M502,272 l-6,-6" class="g"/>
  <!-- Land -->
  <rect x="300" y="300" width="110" height="46" rx="10" class="st"/><text x="340" y="320" class="t">Land</text><text x="340" y="334" class="xs">clip · land</text>
  <path d="M312,324 h14 M319,312 v12" class="g"/>
  <!-- Any + Hurt -->
  <rect x="240" y="430" width="100" height="40" rx="10" fill="#2a2d36" stroke="#6b7280" stroke-dasharray="4 3"/><text x="290" y="455" class="t" text-anchor="middle">Any State</text>
  <rect x="440" y="430" width="110" height="46" rx="10" class="st"/><text x="480" y="450" class="t">Hurt</text><text x="480" y="464" class="xs">clip · hurt</text>
  <path d="M452,446 l6,-6 6,6 -6,6 z" fill="none" stroke="#f87171" stroke-width="1.4"/>
  <!-- arrows -->
  <path d="M412,186 C440,170 460,166 488,168" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#ahb)"/>
  <rect x="418" y="148" width="62" height="14" rx="3" fill="#111827" fill-opacity="0.9"/><text x="422" y="158" class="lab">jump ∧ grnd</text>
  <path d="M545,196 L545,248" class="arr" marker-end="url(#ah)"/>
  <rect x="550" y="214" width="64" height="14" rx="3" fill="#111827" fill-opacity="0.9"/><text x="554" y="224" class="lab">exit 0.95</text>
  <path d="M412,214 C450,240 460,262 488,268" class="arr" marker-end="url(#ah)"/>
  <rect x="414" y="246" width="52" height="14" rx="3" fill="#111827" fill-opacity="0.9"/><text x="418" y="256" class="lab">!grounded</text>
  <path d="M490,286 C460,310 440,318 412,322" class="arr" marker-end="url(#ah)"/>
  <rect x="440" y="314" width="52" height="14" rx="3" fill="#111827" fill-opacity="0.9"/><text x="444" y="324" class="lab">grounded</text>
  <path d="M340,300 L340,232" class="arr" marker-end="url(#ah)"/>
  <rect x="346" y="262" width="52" height="14" rx="3" fill="#111827" fill-opacity="0.9"/><text x="350" y="272" class="lab">exit 0.8</text>
  <path d="M340,450 L438,452" class="arr" marker-end="url(#ah)"/>
  <rect x="362" y="434" width="48" height="14" rx="3" fill="#111827" fill-opacity="0.9"/><text x="368" y="444" class="lab">hurt</text>
  <path d="M500,430 C520,380 470,250 410,212" class="arr" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="470" y="378" width="56" height="14" rx="3" fill="#111827" fill-opacity="0.9"/><text x="474" y="388" class="lab">exit 1.0</text>
  <text x="212" y="528" class="xs">drag from a state's edge: new transition · double-click: open blend space / sub-machine</text>

  <!-- right: blend space + preview -->
  <rect x="660" y="106" width="276" height="430" fill="#262931" stroke="#3b3f4b"/>
  <text x="668" y="124" class="hdr">Blend space 2D</text><text x="770" y="124" class="xs">UpperBody ▸ Aim</text>
  <rect x="672" y="134" width="252" height="200" fill="#1b1d23" stroke="#3b3f4b"/>
  <g stroke="#2f333d"><line x1="798" y1="134" x2="798" y2="334"/><line x1="672" y1="234" x2="924" y2="234"/></g>
  <text x="676" y="146" class="xs">aim_y +1</text><text x="676" y="330" class="xs">-1</text><text x="900" y="246" class="xs">+1</text><text x="676" y="246" class="xs">-1</text>
  <!-- triangulation -->
  <g fill="none" stroke="#6b7280" stroke-width="1">
    <path d="M692,150 L798,150 L904,150 L904,318 L798,318 L692,318 Z"/>
    <path d="M692,150 L798,234 L904,150 M692,318 L798,234 L904,318 M692,234 L798,234 L904,234 M798,150 L798,318"/>
  </g>
  <!-- active triangle -->
  <path d="M798,234 L904,234 L904,318" fill="#f472b6" fill-opacity="0.18" stroke="#f472b6" stroke-width="1.4"/>
  <!-- clip points -->
  <g fill="#e5e7eb" stroke="#111827">
    <circle cx="692" cy="150" r="4.5"/><circle cx="798" cy="150" r="4.5"/><circle cx="904" cy="150" r="4.5"/>
    <circle cx="692" cy="234" r="4.5"/><circle cx="798" cy="234" r="4.5"/><circle cx="904" cy="234" r="4.5"/>
    <circle cx="692" cy="318" r="4.5"/><circle cx="798" cy="318" r="4.5"/><circle cx="904" cy="318" r="4.5"/>
  </g>
  <g class="xs"><text x="700" y="162">aim_up_back</text><text x="806" y="162">aim_up</text><text x="806" y="246">aim_fwd</text><text x="868" y="228">aim_fwd_r</text><text x="860" y="312">aim_down_fwd</text></g>
  <!-- preview point -->
  <circle cx="862" cy="259" r="7" fill="#f472b6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="668" y="356" class="s">weights</text>
  <g class="m">
    <text x="668" y="374">aim_fwd</text><rect x="760" y="366" width="100" height="8" rx="2" fill="#3b3f4b"/><rect x="760" y="366" width="40" height="8" rx="2" fill="#f472b6"/><text x="868" y="374">0.40</text>
    <text x="668" y="392">aim_fwd_r</text><rect x="760" y="384" width="100" height="8" rx="2" fill="#3b3f4b"/><rect x="760" y="384" width="30" height="8" rx="2" fill="#f472b6"/><text x="868" y="392">0.30</text>
    <text x="668" y="410">aim_down_fwd</text><rect x="760" y="402" width="100" height="8" rx="2" fill="#3b3f4b"/><rect x="760" y="402" width="30" height="8" rx="2" fill="#f472b6"/><text x="868" y="410">0.30</text>
  </g>
  <line x1="664" y1="420" x2="932" y2="420" stroke="#3b3f4b"/>
  <text x="668" y="438" class="hdr">Preview</text>
  <rect x="668" y="444" width="260" height="86" fill="#2b2e36" stroke="#3b3f4b"/>
  <g stroke="#111827">
    <rect x="782" y="466" width="24" height="40" rx="8" fill="#4b7bb5"/><circle cx="794" cy="458" r="10" fill="#f2c9a0"/>
    <rect x="788" y="504" width="9" height="24" rx="4" fill="#2f4f6f" transform="rotate(14 792 504)"/><rect x="796" y="504" width="9" height="24" rx="4" fill="#284560" transform="rotate(-10 800 504)"/>
    <rect x="804" y="470" width="30" height="7" rx="3" fill="#4b7bb5" transform="rotate(16 804 473)"/>
  </g>
  <text x="676" y="524" class="xs">Move 0.58 · Aim layer 1.0</text>

  <!-- callouts -->
  <g>
    <circle cx="322" cy="60" r="9" fill="#2563eb"/><text x="322" y="64" class="num" text-anchor="middle">1</text>
    <circle cx="188" cy="114" r="9" fill="#2563eb"/><text x="188" y="118" class="num" text-anchor="middle">2</text>
    <circle cx="276" cy="166" r="9" fill="#2563eb"/><text x="276" y="170" class="num" text-anchor="middle">3</text>
    <circle cx="430" cy="140" r="9" fill="#2563eb"/><text x="430" y="144" class="num" text-anchor="middle">4</text>
    <circle cx="230" cy="420" r="9" fill="#2563eb"/><text x="230" y="424" class="num" text-anchor="middle">5</text>
    <circle cx="924" cy="114" r="9" fill="#2563eb"/><text x="924" y="118" class="num" text-anchor="middle">6</text>
  </g>

  <!-- caption -->
  <g class="cap">
    <text x="20" y="570"><tspan font-weight="600">1</tspan>  Layer tabs: the base layer, an override layer with a bone mask (UpperBody) and an additive layer; the preview skeleton and a debug-instance picker</text>
    <text x="34" y="588">that attaches to a node in a game running from the editor.</text>
    <text x="20" y="610"><tspan font-weight="600">2</tspan>  Parameters with live controls (slider, checkbox, Fire for triggers), and the selected transition's conditions, duration, exit time and interrupt mode.</text>
    <text x="20" y="632"><tspan font-weight="600">3</tspan>  The active state glows and shows its normalised time.  <tspan font-weight="600">4</tspan>  A transition in progress is drawn in blue; labels summarise conditions or exit times.</text>
    <text x="20" y="654"><tspan font-weight="600">5</tspan>  Any State: its transitions (here: hurt) can leave from every state of the machine.</text>
    <text x="20" y="676"><tspan font-weight="600">6</tspan>  The 2D blend space editor: clip points, their triangulation, the preview point in its triangle and the three live weights; a small live preview below.</text>
  </g>
</svg>
