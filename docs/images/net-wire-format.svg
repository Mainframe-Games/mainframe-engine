<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Network buffer wire format</title>
  <desc>Example packet written with NetBufferWriter: raw BinaryWriter encoding with no header. Shows how a byte, a string, a Vector3 and an INetworkTransferable array are laid out, and the buffer pool lifecycle.</desc>
  <rect width="960" height="380" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:14px;fill:#111827}
    .t{fill:#1f2937}
    .s{fill:#4b5563;font-size:11.5px}
    .m{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:11.5px;fill:#1f2937}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>

  <text x="20" y="28" class="hdr">Example: writer.Write((byte)1); Write("hi"); Write(Vector3); Write(items[2])</text>

  <!-- packet -->
  <g>
    <rect x="20" y="44" width="50" height="44" fill="#fde68a" stroke="#374151"/>
    <rect x="70" y="44" width="40" height="44" fill="#bfdbfe" stroke="#374151"/>
    <rect x="110" y="44" width="80" height="44" fill="#bfdbfe" stroke="#374151"/>
    <rect x="190" y="44" width="240" height="44" fill="#bbf7d0" stroke="#374151"/>
    <rect x="430" y="44" width="100" height="44" fill="#e9d5ff" stroke="#374151"/>
    <rect x="530" y="44" width="190" height="44" fill="#f5d0fe" stroke="#374151"/>
    <rect x="720" y="44" width="190" height="44" fill="#f5d0fe" stroke="#374151"/>
  </g>
  <text x="28" y="70" class="m">01</text>
  <text x="78" y="70" class="m">02</text>
  <text x="118" y="70" class="m">68 69</text>
  <text x="198" y="70" class="m">f32 x · f32 y · f32 z</text>
  <text x="438" y="70" class="m">02 00 00 00</text>
  <text x="538" y="70" class="m">item[0].NetworkWrite</text>
  <text x="728" y="70" class="m">item[1].NetworkWrite</text>

  <text x="20" y="108" class="s">byte</text>
  <text x="70" y="108" class="s">7-bit len</text>
  <text x="120" y="108" class="s">UTF-8</text>
  <text x="250" y="108" class="s">Vector3 = 12 B, little-endian</text>
  <text x="432" y="108" class="s">int32 count</text>
  <text x="600" y="108" class="s">INetworkTransferable elements (user-defined)</text>

  <rect x="20" y="126" width="890" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="34" y="151" class="t">No header: no message-type id, length, sequence, version or compression. The receiver must already know the layout.</text>

  <!-- pool lifecycle -->
  <text x="20" y="200" class="hdr">NetBufferPool lifecycle (internal, single-threaded)</text>
  <g>
    <rect x="20" y="214" width="190" height="56" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="32" y="236" class="t">available Queue</text>
    <text x="32" y="256" class="s">writers / readers</text>

    <rect x="290" y="214" width="190" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="302" y="236" class="t">GetWriter(1024)</text>
    <text x="302" y="256" class="s">GetReader(bytes) → Populate</text>

    <rect x="560" y="214" width="170" height="56" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="572" y="236" class="t">active List</text>
    <text x="572" y="256" class="s">in use by caller</text>

    <rect x="780" y="214" width="130" height="56" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="792" y="236" class="t">Dispose()</text>
    <text x="792" y="256" class="s">ReturnToPool</text>
  </g>
  <line x1="210" y1="242" x2="288" y2="242" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="242" x2="558" y2="242" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="730" y1="242" x2="778" y2="242" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M845,272 C845,320 115,320 115,274" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="338" class="s">Reset() → remove from active (O(n)) → enqueue (no double-return guard)</text>
  <text x="20" y="364" class="s">Empty queue → allocate new buffer. NetworkNode.Dispose → NetBufferPool.Destroy() frees everything.</text>
</svg>
