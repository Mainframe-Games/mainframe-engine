<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Skeleton tab, mesh mode and weight brush (proposal)</title>
  <desc>Mesh mode on the body attachment. The viewport shows the torso image with a triangulated mesh: orange hull vertices, white interior vertices, a blue constrained edge across the waist, and a weight heat overlay for the selected bone torso (red is full weight, blue none). The weight brush circle hovers over the waist. The tool strip has Generate, vertex, edge and brush modes. The right panel has generation sliders (density, alpha threshold), the bound bones with colours and locks, brush mode buttons (add, subtract, replace, smooth), radius and strength, Auto, Prune and Normalise buttons, and a weight table for two selected vertices.</desc>
  <rect width="960" height="640" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:12.5px;fill:#e5e7eb}
    .t{fill:#d1d5db;font-size:11.5px}
    .s{fill:#9ca3af;font-size:10.5px}
    .xs{fill:#9ca3af;font-size:9.5px}
    .m{fill:#d1d5db;font-size:10.5px;font-family:ui-monospace, Menlo, Consolas, monospace}
    .cap{fill:#374151;font-size:12px}
    .num{fill:#ffffff;font-size:10.5px;font-weight:700}
    .g{fill:none;stroke:#d1d5db;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .btn{fill:#2f333d;stroke:#3b3f4b}
    .on{fill:#1d4ed8;stroke:#3b82f6}
    .fld{fill:#121418;stroke:#3b3f4b}
    .tri{fill:none;stroke:#e5e7eb;stroke-opacity:0.55;stroke-width:0.9}
    .hv{fill:#f59e0b;stroke:#111827;stroke-width:0.8}
    .iv{fill:#ffffff;stroke:#111827;stroke-width:0.8}
  </style>
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="chk3" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#2b2e36"/><rect width="8" height="8" fill="#30333c"/><rect x="8" y="8" width="8" height="8" fill="#30333c"/>
    </pattern>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="920" height="480" rx="8" fill="#1f2128" stroke="#111827"/>
  <rect x="20" y="20" width="920" height="26" rx="8" fill="#15171c"/>
  <rect x="20" y="38" width="920" height="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/><circle cx="54" cy="33" r="5" fill="#f59e0b"/><circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="480" y="37" class="s" text-anchor="middle">Mainframe Engine — MyGame — hero.mskel* · Setup · mesh: body</text>

  <!-- tool strip -->
  <rect x="20" y="46" width="920" height="32" fill="#2a2d36"/>
  <rect x="28" y="51" width="132" height="22" rx="4" class="fld"/>
  <rect x="30" y="53" width="64" height="18" rx="3" class="on"/><text x="62" y="66" class="t" text-anchor="middle">Setup</text>
  <text x="126" y="66" class="s" text-anchor="middle">Animate</text>
  <text x="176" y="66" class="s">Mesh</text>
  <rect x="210" y="51" width="70" height="22" rx="3" class="btn"/><text x="218" y="66" class="t">⟳ Generate</text>
  <rect x="286" y="51" width="22" height="22" rx="3" class="btn"/><circle cx="297" cy="62" r="3" fill="#ffffff"/><path d="M291,56 l3,3 M303,56 l-3,3" class="g"/>
  <rect x="312" y="51" width="22" height="22" rx="3" class="btn"/><path d="M317,67 l12,-10" stroke="#60a5fa" stroke-width="2"/><circle cx="317" cy="67" r="2" fill="#fff"/><circle cx="329" cy="57" r="2" fill="#fff"/>
  <rect x="338" y="51" width="22" height="22" rx="3" class="on"/><circle cx="349" cy="62" r="6" fill="none" stroke="#f472b6" stroke-width="1.4"/><circle cx="349" cy="62" r="2" fill="#f472b6"/>
  <line x1="370" y1="53" x2="370" y2="71" stroke="#3b3f4b"/>
  <rect x="378" y="51" width="22" height="22" rx="3" class="on"/><path d="M383,67 l6,-11 6,11 z" class="g"/>
  <rect x="404" y="51" width="22" height="22" rx="3" class="on"/><rect x="409" y="56" width="12" height="12" fill="url(#heat)"/>
  <text x="434" y="66" class="xs">triangles · weights</text>
  <rect x="820" y="51" width="112" height="22" rx="3" class="btn"/><text x="830" y="66" class="t">✓ Done (Esc)</text>

  <!-- viewport -->
  <rect x="24" y="82" width="600" height="414" fill="url(#chk3)" stroke="#3b3f4b"/>
  <!-- image -->
  <path d="M250,110 q74,-20 148,0 l14,160 q-4,80 -40,150 l-96,0 q-36,-70 -40,-150 z" fill="#4b7bb5" stroke="#111827"/>
  <!-- heat overlay -->
  <path d="M250,110 q74,-20 148,0 l14,160 q-4,80 -40,150 l-96,0 q-36,-70 -40,-150 z" fill="url(#heat)"/>
  <!-- triangulation -->
  <g class="tri">
    <path d="M250,110 L324,102 L398,110 L412,270 L372,420 L276,420 L236,270 Z"/>
    <path d="M250,110 L290,180 L324,102 L358,180 L398,110"/>
    <path d="M290,180 L358,180 L412,270 L358,260 L290,260 L236,270 L290,180"/>
    <path d="M290,180 L290,260 M358,180 L358,260 M290,260 L324,340 L358,260"/>
    <path d="M236,270 L276,420 L324,340 L372,420 L412,270 M290,260 L276,420 M358,260 L372,420"/>
    <path d="M290,180 L324,220 L358,180 M324,220 L290,260 M324,220 L358,260"/>
  </g>
  <!-- constrained edge (waist crease) -->
  <path d="M236,270 L290,260 L358,260 L412,270" stroke="#60a5fa" stroke-width="2.4" fill="none"/>
  <!-- vertices -->
  <g>
    <circle cx="250" cy="110" r="4.5" class="hv"/><circle cx="324" cy="102" r="4.5" class="hv"/><circle cx="398" cy="110" r="4.5" class="hv"/>
    <circle cx="412" cy="270" r="4.5" class="hv"/><circle cx="372" cy="420" r="4.5" class="hv"/><circle cx="276" cy="420" r="4.5" class="hv"/><circle cx="236" cy="270" r="4.5" class="hv"/>
    <circle cx="290" cy="180" r="4" class="iv"/><circle cx="358" cy="180" r="4" class="iv"/><circle cx="324" cy="220" r="4" class="iv"/>
    <circle cx="290" cy="260" r="4" class="iv"/><circle cx="358" cy="260" r="4" class="iv"/><circle cx="324" cy="340" r="4" class="iv"/>
  </g>
  <!-- selected vertices -->
  <circle cx="290" cy="260" r="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="358" cy="260" r="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <!-- bones -->
  <path d="M324,300 l7,-7 l-7,-180 l-7,180 z" fill="#ef4444" fill-opacity="0.5" stroke="#fff" stroke-width="1"/>
  <path d="M324,300 l7,7 l-7,90 l-7,-90 z" fill="#3b82f6" fill-opacity="0.45" stroke="#e5e7eb" stroke-width="0.8"/>
  <circle cx="324" cy="300" r="4" fill="#fff"/>
  <!-- brush -->
  <circle cx="376" cy="250" r="44" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-width="1.6"/>
  <circle cx="376" cy="250" r="26" fill="none" stroke="#f472b6" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- legend -->
  <rect x="470" y="410" width="140" height="74" rx="4" fill="#111827" fill-opacity="0.85"/>
  <text x="478" y="426" class="xs">weight of torso</text>
  <defs><linearGradient id="heatH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3b82f6"/><stop offset="0.35" stop-color="#22c55e"/><stop offset="0.55" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs>
  <rect x="478" y="434" width="124" height="10" fill="url(#heatH)"/>
  <text x="478" y="456" class="xs">0</text><text x="596" y="456" class="xs">1</text>
  <circle cx="482" cy="472" r="4" class="hv"/><text x="490" y="476" class="xs">hull</text>
  <circle cx="526" cy="472" r="4" class="iv"/><text x="534" y="476" class="xs">interior</text>
  <path d="M570,472 h20" stroke="#60a5fa" stroke-width="2.4"/><text x="594" y="476" class="xs">edge</text>
  <text x="32" y="488" class="xs">13 vertices · 16 triangles · click: add · Del: remove · E: edge · Shift-click hull: insert</text>

  <!-- right panel -->
  <rect x="628" y="82" width="308" height="414" fill="#262931" stroke="#3b3f4b"/>
  <text x="636" y="100" class="hdr">Generate</text>
  <text x="636" y="122" class="s">Density</text><rect x="720" y="114" width="160" height="4" rx="2" fill="#3b3f4b"/><circle cx="772" cy="116" r="6" fill="#60a5fa"/><text x="890" y="122" class="m">0.35</text>
  <text x="636" y="144" class="s">Alpha threshold</text><rect x="720" y="136" width="160" height="4" rx="2" fill="#3b3f4b"/><circle cx="740" cy="138" r="6" fill="#60a5fa"/><text x="890" y="144" class="m">0.10</text>
  <line x1="632" y1="156" x2="932" y2="156" stroke="#3b3f4b"/>
  <text x="636" y="176" class="hdr">Bones</text>
  <rect x="680" y="164" width="22" height="18" rx="3" class="btn"/><text x="686" y="177" class="xs">+</text>
  <rect x="636" y="186" width="292" height="20" fill="#1d4ed8" opacity="0.45"/>
  <rect x="642" y="191" width="10" height="10" fill="#ef4444"/><text x="660" y="200" class="t">torso</text>
  <rect x="642" y="213" width="10" height="10" fill="#3b82f6"/><text x="660" y="222" class="t">hips</text><text x="876" y="222" class="xs">locked</text>
  <rect x="642" y="235" width="10" height="10" fill="#a3e635"/><text x="660" y="244" class="t">chest_fat</text>
  <line x1="632" y1="258" x2="932" y2="258" stroke="#3b3f4b"/>
  <text x="636" y="278" class="hdr">Brush</text>
  <g transform="translate(636,286)">
    <rect width="60" height="22" rx="3" class="on"/><text x="30" y="15" class="t" text-anchor="middle">Add</text>
    <rect x="64" width="70" height="22" rx="3" class="btn"/><text x="99" y="15" class="t" text-anchor="middle">Subtract</text>
    <rect x="138" width="66" height="22" rx="3" class="btn"/><text x="171" y="15" class="t" text-anchor="middle">Replace</text>
    <rect x="208" width="84" height="22" rx="3" class="btn"/><text x="250" y="15" class="t" text-anchor="middle">Smooth</text>
  </g>
  <text x="636" y="330" class="s">Radius</text><rect x="700" y="322" width="180" height="4" rx="2" fill="#3b3f4b"/><circle cx="760" cy="324" r="6" fill="#f472b6"/><text x="890" y="330" class="m">44 px</text>
  <text x="636" y="352" class="s">Strength</text><rect x="700" y="344" width="180" height="4" rx="2" fill="#3b3f4b"/><circle cx="790" cy="346" r="6" fill="#f472b6"/><text x="890" y="352" class="m">0.50</text>
  <g transform="translate(636,364)">
    <rect width="92" height="22" rx="3" class="btn"/><text x="46" y="15" class="t" text-anchor="middle">⚙ Auto (⌘W)</text>
    <rect x="98" width="92" height="22" rx="3" class="btn"/><text x="144" y="15" class="t" text-anchor="middle">Prune &lt; 0.01</text>
    <rect x="196" width="96" height="22" rx="3" class="btn"/><text x="244" y="15" class="t" text-anchor="middle">Normalise</text>
  </g>
  <line x1="632" y1="396" x2="932" y2="396" stroke="#3b3f4b"/>
  <text x="636" y="414" class="hdr">Weights · 2 vertices</text>
  <g class="m">
    <text x="636" y="434" class="xs">vertex</text><text x="720" y="434" class="xs">torso</text><text x="790" y="434" class="xs">hips</text><text x="860" y="434" class="xs">chest_fat</text>
    <text x="636" y="454">#10</text><rect x="714" y="442" width="58" height="18" rx="3" class="fld"/><text x="720" y="455">0.62</text><text x="790" y="455">0.38</text><text x="860" y="455">0.00</text>
    <text x="636" y="476">#11</text><rect x="714" y="464" width="58" height="18" rx="3" class="fld"/><text x="720" y="477">0.58</text><text x="790" y="477">0.42</text><text x="860" y="477">0.00</text>
  </g>

  <!-- callouts -->
  <g>
    <circle cx="245" cy="78" r="9" fill="#2563eb"/><text x="245" y="82" class="num" text-anchor="middle">1</text>
    <circle cx="200" cy="200" r="9" fill="#2563eb"/><text x="200" y="204" class="num" text-anchor="middle">2</text>
    <circle cx="446" cy="250" r="9" fill="#2563eb"/><text x="446" y="254" class="num" text-anchor="middle">3</text>
    <circle cx="920" cy="100" r="9" fill="#2563eb"/><text x="920" y="104" class="num" text-anchor="middle">4</text>
    <circle cx="920" cy="414" r="9" fill="#2563eb"/><text x="920" y="418" class="num" text-anchor="middle">5</text>
  </g>

  <!-- caption -->
  <g class="cap">
    <text x="20" y="530"><tspan font-weight="600">1</tspan>  Mesh tools: Generate (auto mesh from alpha), vertices, constrained edges, the weight brush; overlays for triangles and weights.</text>
    <text x="20" y="552"><tspan font-weight="600">2</tspan>  The mesh: hull vertices (orange), interior vertices (white), a constrained edge at the waist (blue) so it creases cleanly; two selected vertices.</text>
    <text x="20" y="574"><tspan font-weight="600">3</tspan>  The weight brush over the selected bone's heat map (red: full weight, blue: none), with its radius and falloff.</text>
    <text x="20" y="596"><tspan font-weight="600">4</tspan>  Generation sliders, bound bones (colour, lock), brush modes, radius and strength, Auto weights (heat diffusion), Prune, Normalise.</text>
    <text x="20" y="618"><tspan font-weight="600">5</tspan>  The weight table for the selected vertices: editing one bone renormalises the unlocked others.</text>
  </g>
</svg>
