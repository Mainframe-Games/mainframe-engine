<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Joint gizmos and inspector (proposal G9)</title>
  <desc>The editor's 3D viewport with two joints: a selected HingeJoint3D between a door frame and a door, drawn with its hinge axis, the coincident anchors of both bodies, the limit arc from minus 90 to plus 100 degrees and the current angle; and a ConeTwistJoint3D at a mannequin's shoulder, drawn with its swing cone and twist arc. The inspector on the right shows the hinge's groups: Joint (node paths with pick buttons, collision exclusion), Limit, Motor, Spring and Breaking.</desc>
  <rect width="960" height="600" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:13px;fill:#e5e7eb}
    .t{fill:#d1d5db;font-size:12px}
    .s{fill:#9ca3af;font-size:11px}
    .m{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:11px;fill:#e5e7eb}
    .grp{fill:#8b93a5;font-size:11px;font-weight:600}
    .cap{fill:#374151;font-size:12px}
    .leg{fill:#1f2937;font-size:12px}
    .badge{fill:#1d4ed8}
    .bt{fill:#ffffff;font-size:11px;font-weight:700}
    .gl{font-size:11px;font-weight:600}
  </style>

  <!-- window -->
  <rect x="20" y="20" width="920" height="450" rx="8" fill="#1f2128" stroke="#111827"/>
  <rect x="20" y="20" width="920" height="26" rx="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/><circle cx="54" cy="33" r="5" fill="#f59e0b"/><circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="380" y="38" class="s">Mainframe Engine — MyGame — Joints.mscene*</text>
  <rect x="20" y="46" width="920" height="30" fill="#2a2d36"/>
  <rect x="32" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="38" y="65" class="t">↖</text>
  <rect x="58" y="52" width="22" height="18" rx="3" fill="#1d4ed8"/><text x="64" y="65" class="t">✥</text>
  <rect x="84" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="90" y="65" class="t">⟳</text>

  <!-- viewport -->
  <rect x="28" y="80" width="612" height="384" fill="#20232a" stroke="#3b3f4b"/>
  <rect x="28" y="80" width="120" height="22" fill="#2f333d"/><text x="38" y="96" class="t">Joints.mscene*</text>
  <rect x="32" y="104" width="604" height="356" fill="#2c3540"/>
  <g stroke="#3d4955" stroke-width="1">
    <line x1="32" y1="400" x2="636" y2="400"/><line x1="32" y1="430" x2="636" y2="430"/>
    <line x1="140" y1="380" x2="100" y2="460"/><line x1="300" y1="380" x2="290" y2="460"/><line x1="460" y1="380" x2="480" y2="460"/>
  </g>

  <!-- hinge: frame post (static) and door (dynamic) -->
  <rect x="104" y="150" width="20" height="240" fill="#6b7280" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="126,160 276,182 276,372 126,384" fill="#a8885f" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- hinge axis (joint local Z) -->
  <line x1="125" y1="128" x2="125" y2="420" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="119,134 125,120 131,134" fill="#3b82f6"/>
  <!-- limit arc (-90 .. +100 degrees) -->
  <path d="M 125 300 m 0 -26 A 95 26 0 1 1 63 294" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="125" y1="274" x2="125" y2="262" stroke="#f59e0b" stroke-width="2"/>
  <line x1="63" y1="294" x2="54" y2="286" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="258" class="gl" fill="#fbbf24">−90°</text>
  <text x="36" y="282" class="gl" fill="#fbbf24">+100°</text>
  <!-- current angle -->
  <line x1="125" y1="300" x2="212" y2="314" stroke="#ffffff" stroke-width="2"/>
  <text x="168" y="330" class="gl" fill="#ffffff">25°</text>
  <!-- anchors A and B -->
  <circle cx="125" cy="300" r="6" fill="none" stroke="#fb923c" stroke-width="2"/>
  <circle cx="125" cy="300" r="2.5" fill="#22d3ee"/>
  <circle cx="125" cy="300" r="11" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="140" y="117" class="s">Hinge (selected)</text>

  <!-- cone-twist: mannequin torso and upper arm -->
  <rect x="380" y="150" width="70" height="150" rx="30" fill="#7c8696" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="415" cy="128" r="20" fill="#7c8696" stroke="#f59e0b" stroke-width="1.5"/>
  <g transform="rotate(-35 458 176)">
    <rect x="458" y="164" width="90" height="24" rx="12" fill="#8f99a8" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <!-- swing cone along the twist axis (joint local X) -->
  <polygon points="458,176 590,96 590,196" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <ellipse cx="590" cy="146" rx="14" ry="50" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="458" y1="176" x2="612" y2="146" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- twist arc (+-30 degrees) -->
  <path d="M 548 128 A 22 22 0 0 1 548 164" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="520" y="214" class="gl" fill="#fbbf24">swing 45° · twist ±30°</text>
  <circle cx="458" cy="176" r="5" fill="none" stroke="#fb923c" stroke-width="2"/>
  <circle cx="458" cy="176" r="2.5" fill="#22d3ee"/>
  <text x="360" y="320" class="s">Shoulder (ConeTwistJoint3D): debug lines only</text>

  <!-- legend chips -->
  <g>
    <rect x="40" y="436" width="584" height="20" rx="3" fill="#1f2128" opacity="0.9"/>
    <circle cx="52" cy="446" r="4" fill="none" stroke="#fb923c" stroke-width="2"/><text x="60" y="450" class="s">anchor on A</text>
    <circle cx="140" cy="446" r="3" fill="#22d3ee"/><text x="148" y="450" class="s">anchor on B</text>
    <line x1="222" y1="446" x2="242" y2="446" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3"/><text x="248" y="450" class="s">axis</text>
    <line x1="290" y1="446" x2="310" y2="446" stroke="#f59e0b" stroke-width="2.5"/><text x="316" y="450" class="s">limit</text>
    <line x1="360" y1="446" x2="380" y2="446" stroke="#ffffff" stroke-width="2"/><text x="386" y="450" class="s">current</text>
    <line x1="440" y1="446" x2="460" y2="446" stroke="#ef4444" stroke-width="2"/><text x="466" y="450" class="s">anchors drifted apart</text>
  </g>

  <!-- inspector -->
  <rect x="644" y="80" width="292" height="384" fill="#262931" stroke="#3b3f4b"/>
  <text x="654" y="98" class="hdr">Inspector</text>
  <rect x="654" y="108" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text x="674" y="120" class="t">Hinge</text><text x="716" y="120" class="s">HingeJoint3D</text>
  <rect x="906" y="106" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="912" y="119" class="t">⟲</text>

  <text x="654" y="146" class="grp">JOINT</text>
  <text x="664" y="166" class="t">Node A</text>
  <rect x="756" y="154" width="142" height="18" rx="3" fill="#121418" stroke="#2f333d"/><text x="762" y="167" class="m">../Frame</text>
  <rect x="902" y="154" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="907" y="167" class="t">⌖</text>
  <text x="664" y="188" class="t">Node B</text>
  <rect x="756" y="176" width="142" height="18" rx="3" fill="#121418" stroke="#2f333d"/><text x="762" y="189" class="m">../Door</text>
  <rect x="902" y="176" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="907" y="189" class="t">⌖</text>
  <text x="664" y="210" class="t">Exclude collision</text>
  <rect x="756" y="199" width="14" height="14" rx="2" fill="#3b82f6"/><text x="758" y="210" class="bt">✓</text>

  <text x="654" y="236" class="grp">LIMIT</text>
  <text x="664" y="256" class="t">Use limit</text>
  <rect x="756" y="245" width="14" height="14" rx="2" fill="#3b82f6"/><text x="758" y="256" class="bt">✓</text>
  <text x="664" y="278" class="t">Lower</text>
  <rect x="756" y="266" width="168" height="18" rx="3" fill="#121418" stroke="#2f333d"/><text x="762" y="279" class="m">-90 °</text>
  <text x="664" y="300" class="t">Upper</text>
  <rect x="756" y="288" width="168" height="18" rx="3" fill="#121418" stroke="#2f333d"/><text x="762" y="301" class="m">100 °</text>

  <text x="654" y="326" class="grp">MOTOR</text>
  <text x="664" y="346" class="t">Enabled</text>
  <rect x="756" y="335" width="14" height="14" rx="2" fill="#121418" stroke="#4b5263"/>
  <text x="654" y="372" class="grp">SPRING</text>
  <text x="664" y="392" class="t">Enabled</text>
  <rect x="756" y="381" width="14" height="14" rx="2" fill="#121418" stroke="#4b5263"/>

  <text x="654" y="418" class="grp">BREAKING</text>
  <text x="664" y="438" class="t">Break torque</text>
  <rect x="756" y="426" width="168" height="18" rx="3" fill="#121418" stroke="#2f333d"/><text x="762" y="439" class="m">500 N·m</text>
  <text x="664" y="458" class="s">Break force 0 = never</text>

  <!-- callouts -->
  <circle cx="98" cy="128" r="9" class="badge"/><text x="95" y="132" class="bt">1</text>
  <circle cx="618" cy="96" r="9" class="badge"/><text x="615" y="100" class="bt">2</text>
  <circle cx="886" cy="142" r="9" class="badge"/><text x="883" y="146" class="bt">3</text>
  <circle cx="70" cy="336" r="9" class="badge"/><text x="67" y="340" class="bt">4</text>

  <g>
    <circle cx="34" cy="490" r="8" class="badge"/><text x="31" y="494" class="bt">1</text>
    <text x="50" y="494" class="leg">Selected joint: its axis (hinge = local Z), both bodies' anchors, the limit arc and the current angle, drawn as overlay lines.</text>
    <circle cx="34" cy="514" r="8" class="badge"/><text x="31" y="518" class="bt">2</text>
    <text x="50" y="518" class="leg">Every joint (selected or not) is in the physics debug draw: swing cone and twist arc for a cone-twist joint.</text>
    <circle cx="34" cy="538" r="8" class="badge"/><text x="31" y="542" class="bt">3</text>
    <text x="50" y="542" class="leg">Node A / Node B pickers list only physics bodies ([Export(NodeType = typeof(PhysicsBody3D))]); ⟲ rebuilds a broken joint.</text>
    <circle cx="34" cy="562" r="8" class="badge"/><text x="31" y="566" class="bt">4</text>
    <text x="50" y="566" class="leg">With G7.3 handles (task G9.7), the ends of the limit arc are drag handles that write Lower / Upper with undo.</text>
  </g>
  <text x="20" y="592" class="cap">Inspector rows follow the export groups of HingeJoint3D; Motor and Spring are collapsed to their toggles here.</text>
</svg>
