<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>World-space UI (G11)</title>
  <desc>A first-person game frame showing the three world-space UI tools: a Label3D shop sign drawn in the 3D scene, UiMarker3D nameplates with health bars, an interaction prompt and an off-screen waypoint clamped to the screen edge, and a UiPanel3D terminal on a wall whose RmlUi document is rendered into a texture and clicked through a camera ray.</desc>
  <rect width="960" height="560" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:13px;fill:#e5e7eb}
    .t{fill:#d7dbe4;font-size:12px}
    .s{fill:#8b93a5;font-size:11px}
    .doc{fill:#93c5fd;font-size:10.5px;font-family:ui-monospace, Menlo, Consolas, monospace}
    .cap{fill:#374151;font-size:12px}
    .badge{fill:#3b82f6}
    .bt{fill:#ffffff;font-size:11px;font-weight:700}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#3d5a80"/>
    </linearGradient>
  </defs>

  <!-- game frame -->
  <rect x="20" y="20" width="680" height="470" rx="8" fill="#15171c" stroke="#111827"/>
  <rect x="20" y="20" width="680" height="26" rx="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/><circle cx="54" cy="33" r="5" fill="#f59e0b"/><circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="300" y="38" class="s">MyGame — Outpost.mscene</text>
  <rect x="24" y="46" width="672" height="440" fill="url(#sky)"/>
  <!-- ground -->
  <polygon points="24,300 696,300 696,486 24,486" fill="#2c3a2e"/>

  <!-- left building with the Label3D sign (in perspective) -->
  <polygon points="40,150 210,175 210,330 40,360" fill="#4b4f5c"/>
  <polygon points="70,190 190,203 190,240 70,232" fill="#2a2d36" stroke="#111827"/>
  <text x="84" y="226" font-size="26" font-weight="800" fill="#f59e0b" stroke="#111827" stroke-width="1.5" transform="skewY(6) translate(0,-14)">SHOP</text>
  <circle cx="62" cy="182" r="9" class="badge"/><text x="58.5" y="186" class="bt">1</text>

  <!-- right wall with the UiPanel3D terminal (in perspective) -->
  <polygon points="470,110 696,70 696,380 470,330" fill="#3b3f4b"/>
  <polygon points="500,150 660,124 660,300 500,296" fill="#1f2128" stroke="#3b82f6" stroke-width="1.5"/>
  <g transform="matrix(1,-0.16,0,1,0,0)">
    <rect x="508" y="241" width="144" height="18" fill="#262931"/>
    <text x="514" y="254" class="t" font-size="11">Gate control</text>
    <rect x="514" y="270" width="58" height="22" rx="3" fill="#2563eb"/><text x="530" y="285" fill="#ffffff" font-size="11">Open</text>
    <rect x="580" y="270" width="58" height="22" rx="3" fill="#2f333d"/><text x="594" y="285" class="t" font-size="11">Close</text>
    <text x="514" y="314" class="s">Power</text>
    <rect x="514" y="320" width="124" height="5" rx="2" fill="#121418"/>
    <rect x="514" y="320" width="80" height="5" rx="2" fill="#3b82f6"/>
    <circle cx="594" cy="322" r="5" fill="#d7dbe4"/>
    <text x="514" y="350" class="s">Status: locked</text>
  </g>
  <!-- cursor ray hitting the panel -->
  <line x1="360" y1="470" x2="547" y2="195" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="545,192 545,206 549,202 552,209 555,207 552,201 557,200" fill="#ffffff" stroke="#111827" stroke-width="0.8"/>
  <circle cx="672" cy="112" r="9" class="badge"/><text x="668.5" y="116" class="bt">3</text>

  <!-- interaction prompt (UiMarker3D on the terminal) -->
  <rect x="512" y="336" width="122" height="22" rx="11" fill="#15171c" opacity="0.85" stroke="#4b5263"/>
  <rect x="520" y="340" width="16" height="14" rx="3" fill="#d7dbe4"/><text x="524" y="351" fill="#15171c" font-size="10" font-weight="700">E</text>
  <text x="542" y="351" class="t" font-size="11">Use terminal</text>

  <!-- enemies with nameplates (UiMarker3D) -->
  <g>
    <ellipse cx="300" cy="372" rx="16" ry="5" fill="#1b241c"/>
    <rect x="288" y="318" width="24" height="54" rx="12" fill="#7c2d12"/>
    <circle cx="300" cy="312" r="10" fill="#9a3412"/>
    <rect x="262" y="276" width="84" height="22" rx="3" fill="#15171c" opacity="0.85"/>
    <text x="270" y="288" class="t" font-size="10.5">Goblin</text><text x="316" y="288" class="s" font-size="9.5">Lv 4</text>
    <rect x="270" y="291" width="60" height="4" rx="1" fill="#2f333d"/><rect x="270" y="291" width="38" height="4" rx="1" fill="#ef4444"/>
  </g>
  <g>
    <ellipse cx="410" cy="336" rx="9" ry="3" fill="#1b241c"/>
    <rect x="403" y="306" width="14" height="30" rx="7" fill="#7c2d12"/>
    <circle cx="410" cy="302" r="6" fill="#9a3412"/>
    <rect x="372" y="268" width="84" height="22" rx="3" fill="#15171c" opacity="0.6"/>
    <text x="380" y="280" class="t" font-size="10.5" opacity="0.7">Goblin</text><text x="426" y="280" class="s" font-size="9.5">Lv 2</text>
    <rect x="380" y="283" width="60" height="4" rx="1" fill="#2f333d"/><rect x="380" y="283" width="56" height="4" rx="1" fill="#ef4444" opacity="0.7"/>
  </g>
  <circle cx="252" cy="270" r="9" class="badge"/><text x="248.5" y="274" class="bt">2</text>

  <!-- off-screen waypoint clamped to the left edge -->
  <polygon points="32,250 46,240 46,260" fill="#f59e0b"/>
  <rect x="50" y="242" width="92" height="18" rx="9" fill="#15171c" opacity="0.85"/>
  <text x="58" y="255" class="t" font-size="10.5">Camp · 42 m</text>

  <!-- crosshair -->
  <line x1="355" y1="266" x2="365" y2="266" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
  <line x1="360" y1="261" x2="360" y2="271" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>

  <text x="30" y="480" class="doc">HUD layer 0: markers.rml (UiMarkerHost)</text>

  <!-- legend -->
  <rect x="716" y="20" width="224" height="470" rx="8" fill="#1f2128" stroke="#111827"/>
  <text x="730" y="44" class="hdr">Which tool</text>

  <circle cx="738" cy="70" r="9" class="badge"/><text x="734.5" y="74" class="bt">1</text>
  <text x="754" y="74" class="t" font-weight="600">Label3D</text>
  <text x="730" y="94" class="s">Text in the 3D scene: depth-tested,</text>
  <text x="730" y="110" class="s">tonemapped, fogged by distance.</text>
  <text x="730" y="126" class="s">Billboard or fixed quad, optional</text>
  <text x="730" y="142" class="s">fixed screen size. Signs, damage</text>
  <text x="730" y="158" class="s">numbers, debug tags.</text>
  <text x="730" y="176" class="doc">Text3DRenderer · one draw/page</text>

  <circle cx="738" cy="206" r="9" class="badge"/><text x="734.5" y="210" class="bt">2</text>
  <text x="754" y="210" class="t" font-weight="600">UiMarker3D</text>
  <text x="730" y="230" class="s">RmlUi on a screen layer, moved to</text>
  <text x="730" y="246" class="s">a 3D point every frame. Exact</text>
  <text x="730" y="262" class="s">colours, fade, occlusion, clamping.</text>
  <text x="730" y="278" class="s">Nameplates, health bars, prompts,</text>
  <text x="730" y="294" class="s">waypoints.</text>
  <text x="730" y="312" class="doc">one document, data-for rows</text>

  <circle cx="738" cy="342" r="9" class="badge"/><text x="734.5" y="346" class="bt">3</text>
  <text x="754" y="346" class="t" font-weight="600">UiPanel3D</text>
  <text x="730" y="366" class="s">A full RmlUi context rendered into a</text>
  <text x="730" y="382" class="s">texture on a mesh before the scene</text>
  <text x="730" y="398" class="s">pass. Mouse or crosshair rays turn</text>
  <text x="730" y="414" class="s">into panel pixels. Terminals, screens,</text>
  <text x="730" y="430" class="s">in-world menus.</text>
  <text x="730" y="448" class="doc">own context + target per panel</text>

  <text x="20" y="516" class="cap">Blue badges match the legend. Markers (2) draw after the tonemap with the HUD; labels (1) and panels (3) are part of</text>
  <text x="20" y="534" class="cap">the lit scene, so walls hide them and exposure applies. The dashed line is the cursor ray that UiPanel3D maps to its UV.</text>
</svg>
