<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Editor range handles (proposal G7.3)</title>
  <desc>The editor's 3D viewport with three selected nodes, each with its handles: an OmniLight3D whose range handle is being dragged (a drag label shows the value, a dashed circle the old range), a SpotLight3D with range and cone-angle handles, and an AudioPlayer3D with unit-size and max-distance handles, one of them hovered with a tooltip. The inspector on the right follows the drag.</desc>
  <rect width="960" height="620" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:13px;fill:#e5e7eb}
    .t{fill:#d1d5db;font-size:12px}
    .s{fill:#9ca3af;font-size:11px}
    .m{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:11px;fill:#e5e7eb}
    .cap{fill:#374151;font-size:12px}
    .leg{fill:#1f2937;font-size:12px}
    .badge{fill:#1d4ed8}
    .bt{fill:#ffffff;font-size:11px;font-weight:700}
  </style>

  <!-- window -->
  <rect x="20" y="20" width="920" height="450" rx="8" fill="#1f2128" stroke="#111827"/>
  <rect x="20" y="20" width="920" height="26" rx="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/><circle cx="54" cy="33" r="5" fill="#f59e0b"/><circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="380" y="38" class="s">Mainframe Engine — MyGame — Lights.mscene*</text>

  <!-- toolbar: gizmo tools as icon buttons -->
  <rect x="20" y="46" width="920" height="30" fill="#2a2d36"/>
  <g>
    <rect x="32" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="38" y="65" class="t">↖</text>
    <rect x="58" y="52" width="22" height="18" rx="3" fill="#1d4ed8"/><text x="63" y="65" class="t">✥</text>
    <rect x="84" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="89" y="65" class="t">⟳</text>
    <rect x="110" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="115" y="65" class="t">⤢</text>
    <rect x="144" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="149" y="65" class="t">◍</text>
    <rect x="170" y="52" width="22" height="18" rx="3" fill="#3b3f4b"/><text x="176" y="65" class="t">∩</text>
  </g>

  <!-- viewport panel -->
  <rect x="24" y="80" width="616" height="386" fill="#20232a" stroke="#3b3f4b"/>
  <rect x="24" y="80" width="120" height="22" fill="#2f333d"/><text x="34" y="96" class="t">Lights.mscene*</text>
  <rect x="28" y="104" width="608" height="358" fill="#33475a"/>
  <!-- floor grid -->
  <g stroke="#4d6577" stroke-width="1">
    <line x1="28" y1="410" x2="636" y2="410"/><line x1="28" y1="432" x2="636" y2="432"/><line x1="28" y1="454" x2="636" y2="454"/>
    <line x1="120" y1="392" x2="70" y2="462"/><line x1="240" y1="392" x2="220" y2="462"/><line x1="360" y1="392" x2="368" y2="462"/><line x1="480" y1="392" x2="516" y2="462"/><line x1="600" y1="392" x2="636" y2="440"/>
  </g>
  <text x="40" y="122" class="s">◰ Perspective</text>

  <!-- 1: OmniLight3D, selected, range handle being dragged -->
  <g>
    <circle cx="200" cy="290" r="85" fill="none" stroke="#fde68a" stroke-opacity="0.45" stroke-dasharray="4 4"/>
    <circle cx="200" cy="290" r="115" fill="#fde047" fill-opacity="0.05" stroke="#fde68a" stroke-opacity="0.8" stroke-width="1.5"/>
    <ellipse cx="200" cy="290" rx="115" ry="30" fill="none" stroke="#fde68a" stroke-opacity="0.35"/>
    <ellipse cx="200" cy="290" rx="30" ry="115" fill="none" stroke="#fde68a" stroke-opacity="0.25"/>
    <!-- icon -->
    <circle cx="200" cy="290" r="7" fill="none" stroke="#fde047" stroke-width="1.5"/>
    <g stroke="#fde047" stroke-width="1.2">
      <line x1="210" y1="290" x2="215" y2="290"/><line x1="185" y1="290" x2="190" y2="290"/><line x1="200" y1="280" x2="200" y2="275"/><line x1="200" y1="300" x2="200" y2="305"/>
      <line x1="207" y1="283" x2="211" y2="279"/><line x1="193" y1="297" x2="189" y2="301"/><line x1="207" y1="297" x2="211" y2="301"/><line x1="193" y1="283" x2="189" y2="279"/>
    </g>
    <!-- selection cross + move gizmo at the light -->
    <g stroke-width="2.5">
      <line x1="200" y1="290" x2="248" y2="290" stroke="#ef4444"/><polygon points="248,285 258,290 248,295" fill="#ef4444"/>
      <line x1="200" y1="290" x2="200" y2="242" stroke="#22c55e"/><polygon points="195,242 200,232 205,242" fill="#22c55e"/>
      <line x1="200" y1="290" x2="172" y2="314" stroke="#3b82f6"/>
    </g>
    <!-- the dragged handle on the view-facing circle -->
    <line x1="296" y1="290" x2="334" y2="290" stroke="#ffffff" stroke-opacity="0.6" stroke-dasharray="2 3"/>
    <rect x="310" y="285" width="10" height="10" fill="#fde047" stroke="#ffffff" stroke-width="1.5"/>
    <!-- cursor -->
    <polygon points="318,293 318,309 322,305 325,312 328,311 325,304 331,304" fill="#ffffff" stroke="#111827" stroke-width="0.8"/>
    <!-- drag label -->
    <rect x="328" y="258" width="92" height="20" rx="4" fill="#111827" stroke="#3b3f4b"/>
    <text x="336" y="272" class="m">Range 4.20 m</text>
  </g>

  <!-- 3: SpotLight3D with range and angle handles -->
  <g>
    <circle cx="380" cy="165" r="6" fill="none" stroke="#fde047" stroke-width="1.5"/>
    <g stroke="#fde68a" stroke-opacity="0.75">
      <line x1="380" y1="165" x2="500" y2="121"/><line x1="380" y1="165" x2="500" y2="209"/>
      <line x1="380" y1="165" x2="510" y2="165"/>
    </g>
    <ellipse cx="500" cy="165" rx="12" ry="44" fill="none" stroke="#fde68a" stroke-opacity="0.75"/>
    <ellipse cx="500" cy="165" rx="8" ry="28" fill="none" stroke="#fde68a" stroke-opacity="0.4" stroke-dasharray="3 3"/>
    <rect x="496" y="161" width="8" height="8" fill="#fde047" stroke="#1f2128"/>
    <circle cx="500" cy="121" r="4.5" fill="#fde047" stroke="#1f2128"/>
    <circle cx="500" cy="137" r="4" fill="#33475a" stroke="#fde047" stroke-width="1.5"/>
  </g>

  <!-- 4: AudioPlayer3D with unit size and max distance -->
  <g>
    <circle cx="505" cy="350" r="42" fill="none" stroke="#67e8f9" stroke-opacity="0.7"/>
    <circle cx="505" cy="350" r="96" fill="none" stroke="#67e8f9" stroke-opacity="0.4"/>
    <ellipse cx="505" cy="350" rx="96" ry="24" fill="none" stroke="#67e8f9" stroke-opacity="0.2"/>
    <polygon points="505,342 513,350 505,358 497,350" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
    <rect x="543" y="346" width="8" height="8" fill="#33475a" stroke="#67e8f9" stroke-width="1.5"/>
    <rect x="596" y="345" width="10" height="10" fill="#67e8f9" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="490" y="310" width="138" height="20" rx="4" fill="#111827" stroke="#3b3f4b"/>
    <text x="497" y="324" class="m">Max Distance 18.0 m</text>
  </g>

  <!-- inspector -->
  <rect x="644" y="80" width="292" height="386" fill="#262931" stroke="#3b3f4b"/>
  <text x="656" y="98" class="hdr">Inspector</text>
  <text x="850" y="98" class="s">Node | Signals</text>
  <text x="656" y="124" class="t">☼ Lamp : OmniLight3D</text>
  <text x="656" y="150" class="s">▾ OmniLight3D</text>
  <text x="666" y="172" class="t">Range</text>
  <rect x="718" y="166" width="96" height="4" rx="2" fill="#3b3f4b"/>
  <rect x="718" y="166" width="12" height="4" rx="2" fill="#1d4ed8"/>
  <circle cx="730" cy="168" r="5" fill="#d1d5db"/>
  <rect x="822" y="160" width="76" height="18" rx="2" fill="#3b3f4b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="830" y="173" class="m">4.20</text>
  <text x="656" y="204" class="s">▾ Light3D</text>
  <text x="666" y="226" class="t">Color</text>
  <rect x="822" y="214" width="18" height="16" rx="2" fill="#fde68a"/>
  <rect x="844" y="214" width="54" height="16" rx="2" fill="#3b3f4b"/><text x="850" y="226" class="s">#FDE68A</text>
  <text x="666" y="250" class="t">Energy</text>
  <rect x="822" y="238" width="76" height="16" rx="2" fill="#3b3f4b"/><text x="830" y="250" class="s">1.00</text>
  <text x="656" y="278" class="s">▸ Shadow</text>
  <text x="656" y="304" class="s">▾ Node3D</text>
  <text x="666" y="326" class="t">Position</text>
  <rect x="756" y="314" width="44" height="16" rx="2" fill="#3b3f4b"/><rect x="804" y="314" width="44" height="16" rx="2" fill="#3b3f4b"/><rect x="852" y="314" width="44" height="16" rx="2" fill="#3b3f4b"/>
  <text x="762" y="326" class="s">-2.0</text><text x="810" y="326" class="s">2.5</text><text x="858" y="326" class="s">0.0</text>

  <!-- numbered badges -->
  <circle cx="330" cy="314" r="9" class="badge"/><text x="326.5" y="318" class="bt">1</text>
  <circle cx="434" cy="268" r="9" class="badge"/><text x="430.5" y="272" class="bt">2</text>
  <circle cx="526" cy="121" r="9" class="badge"/><text x="522.5" y="125" class="bt">3</text>
  <circle cx="616" cy="372" r="9" class="badge"/><text x="612.5" y="376" class="bt">4</text>
  <circle cx="914" cy="169" r="9" class="badge"/><text x="910.5" y="173" class="bt">5</text>

  <!-- legend -->
  <g>
    <circle cx="34" cy="492" r="8" class="badge"/><text x="31" y="496" class="bt">1</text>
    <text x="50" y="496" class="leg">OmniLight3D range handle, dragged: writes Range live; release = one undo entry; Esc or right click cancels.</text>
    <circle cx="34" cy="516" r="8" class="badge"/><text x="31" y="520" class="bt">2</text>
    <text x="50" y="520" class="leg">Drag label: the value, built only while a handle is hovered or dragged. The dashed circle is the range before the drag.</text>
    <circle cx="34" cy="540" r="8" class="badge"/><text x="31" y="544" class="bt">3</text>
    <text x="50" y="544" class="leg">SpotLight3D: Range at the tip (square), OuterConeAngle on the outer rim (dot), InnerConeAngle on the dashed inner rim (≤ outer).</text>
    <circle cx="34" cy="564" r="8" class="badge"/><text x="31" y="568" class="bt">4</text>
    <text x="50" y="568" class="leg">AudioPlayer3D: UnitSize (inner sphere) and MaxDistance (outer sphere); the hovered handle shows its tooltip.</text>
    <circle cx="34" cy="588" r="8" class="badge"/><text x="31" y="592" class="bt">5</text>
    <text x="50" y="592" class="leg">The inspector follows the drag (drawn as for the lamp alone). Handles are hit-tested before the gizmo's axes.</text>
  </g>
  <text x="20" y="612" class="cap">Game nodes get the same handles from [Export(Handle = HandleHint.Radius)] or an [HandleProvider] class. Each selected node shows its own handles.</text>
</svg>
