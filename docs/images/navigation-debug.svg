<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Navigation debug view (proposal)</title>
  <desc>Planned editor view of a NavigationGrid2D: the 2D viewport with Visible Navigation on shows the grid region, solid cells baked from static bodies, weighted cells, a NavigationAgent2D with its current path, next path position and target. The toolbar has a Visible Navigation toggle; the inspector shows the grid with Bake and Clear icon buttons and its settings.</desc>
