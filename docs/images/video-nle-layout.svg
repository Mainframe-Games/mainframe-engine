  <!-- legend -->
  <g>
    <text x="24" y="652" class="kb">1</text><text x="40" y="652" class="k">Media pool: Assets/Video only (video, audio, images, timelines); import, new timeline, new folder; Finder drops land here.</text>
    <text x="24" y="667" class="kb">2</text><text x="40" y="667" class="k">Source viewer: I/O marks, insert ( , ) and overwrite ( . ) at the playhead.</text>
    <text x="24" y="682" class="kb">3</text><text x="40" y="682" class="k">Timeline viewer: the program at the timeline's aspect (here 9:16), tracks composited from V1 up.</text>
    <text x="24" y="697" class="kb">4</text><text x="40" y="697" class="k">Inspector (reframe, speed, audio) with a Transcript tab for the selected clip.</text>
    <text x="24" y="712" class="kb">5</text><text x="40" y="712" class="k">Track headers: lock, enable, mute, solo.</text>
    <text x="24" y="727" class="kb">6</text><text x="40" y="727" class="k">Clips: filmstrips and waveforms; collapsed cuts show as ticks; 🔗 marks a linked A/V pair.</text>
    <text x="24" y="742" class="kb">7</text><text x="40" y="742" class="k">Cut editor: the selected clip's whole source window, kept (blue) and cut (grey) regions; click a region to restore it.</text>
  </g>
