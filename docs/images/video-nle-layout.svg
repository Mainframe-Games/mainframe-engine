<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Video mode as a timeline editor: the Edit page layout</title>
  <desc>The Mainframe Editor in Video mode with a 1080 by 1920 timeline open. Menus File, Edit, View, Timeline, Clip, Video, Help. A toolbar with the select and razor tools, snapping and link toggles, the timecode, Export and the Game or Video toggle. Two timeline tabs. The top row holds the media pool (the Assets/Video folder tree with Recordings, Media and Timelines and poster thumbnails), the Source viewer with in and out marks, the Timeline viewer showing a vertical frame, and the Inspector with Inspector and Transcript tabs listing reframe, speed and audio settings. Below, the timeline: track headers V2, V1, A1, A2 with lock, eye, mute and solo icons beside lanes holding a title clip on V2, four video clips with filmstrips on V1, their linked audio on A1, music on A2 and a red playhead; one clip shows thin ticks where cuts were collapsed. At the bottom the cut editor shows the selected clip's whole source window with kept regions in blue and cut regions in grey.</desc>
  <rect width="1000" height="760" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:12px;fill:#e8ebf2}
    .t{fill:#d7dbe4;font-size:11.5px}
    .s{fill:#8b93a5;font-size:10.5px}
    .xs{fill:#8b93a5;font-size:9.5px}
    .m{fill:#d7dbe4;font-size:10.5px;font-family:ui-monospace, Menlo, Consolas, monospace}
    .cl{fill:#e8ebf2;font-size:10px}
    .btn{fill:#2f333d;stroke:#3b3f4b}
    .on{fill:#1d4ed8;stroke:#3b82f6}
    .panel{fill:#1b1d23;stroke:#2f333d}
    .vc{fill:#1e3a6b;stroke:#3b82f6}
    .ac{fill:#14532d;stroke:#22c55e}
    .tc{fill:#4c1d95;stroke:#a78bfa}
    .film{fill:#2b4c86}
    .wave{fill:none;stroke:#86efac;stroke-width:1}
    .k{fill:#111827;font-size:12px}
    .kb{fill:#111827;font-size:12px;font-weight:600}
    .num{fill:#ffffff;font-size:11px;font-weight:700}
  </style>
