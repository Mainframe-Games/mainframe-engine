  <rect x="56" y="73" width="22" height="20" rx="3" class="btn"/><circle cx="63" cy="88" r="2.5" fill="none" stroke="#d7dbe4"/><circle cx="71" cy="88" r="2.5" fill="none" stroke="#d7dbe4"/><path d="M64 86 L72 77 M70 86 L62 77" stroke="#d7dbe4" stroke-width="1.3"/>
