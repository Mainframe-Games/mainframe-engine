<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Where the G6 rendering features join the frame</title>
  <desc>One frame with the proposed rendering features. CPU: the tree tick simulates 3D particles; PrepareFrame selects LODs, writes particle instances and assigns decals. GPU: shadow passes and offscreen views are unchanged; a new IBL bake runs only when the sky changes; a new depth prepass and SSAO run only when SSAO is on and wait for M11 step 1; the scene pass gains PBR, image-based lighting, ambient occlusion, decals and particles; glow, tonemap and overlays are unchanged.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:14px;fill:#111827}
    .bt{font-weight:600;font-size:12.5px;fill:#111827}
    .t{fill:#1f2937}
    .s{fill:#4b5563;font-size:11.5px}
    .n{fill:#15803d;font-size:11.5px}
    .w{fill:#b45309;font-size:11.5px}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>

  <text x="20" y="30" class="hdr">One frame with the G6 features (new parts in green; SSAO in amber)</text>

  <!-- CPU row -->
  <rect x="20" y="42" width="920" height="128" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="36" y="64" class="t" font-weight="600">CPU · main thread (Engine frame order 1–3)</text>

  <rect x="40" y="76" width="280" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="54" y="98" class="bt">Tree.Tick → OnProcess</text>
  <text x="54" y="118" class="n">+ GpuParticles3D: CPU simulation</text>
  <text x="54" y="136" class="n">  (ParticleSimulation, shared with 2D)</text>

  <line x1="322" y1="116" x2="348" y2="116" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="350" y="76" width="570" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="364" y="98" class="bt">RenderServer.PrepareFrame → MeshRenderer.Prepare</text>
  <text x="364" y="116" class="s">sync GPU resources · frustum cull · sort keys (unchanged)</text>
  <text x="364" y="133" class="n">+ LOD level per instance (projected error vs threshold) · visibility ranges</text>
  <text x="364" y="150" class="n">+ particle instances (sorted per emitter) · decal bitmask per instance (≤ 32 decals)</text>

  <!-- GPU row -->
  <rect x="20" y="190" width="920" height="262" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="36" y="212" class="t" font-weight="600">GPU · command buffer of the frame slot (Engine frame order 4–6)</text>

  <!-- B1 shadows -->
  <rect x="36" y="226" width="136" height="168" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="46" y="248" class="bt">Shadow passes</text>
  <text x="46" y="268" class="s">ShadowSystem</text>
  <text x="46" y="286" class="s">cascades · atlas</text>
  <text x="46" y="304" class="s">· point cubes</text>
  <text x="46" y="330" class="n">+ casters drawn at</text>
  <text x="46" y="348" class="n">  the camera's LOD</text>

  <line x1="173" y1="310" x2="184" y2="310" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- B2 offscreen -->
  <rect x="186" y="226" width="136" height="168" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="196" y="248" class="bt">RenderOffscreen</text>
  <text x="196" y="268" class="s">sub-viewports</text>
  <text x="196" y="286" class="s">(editor views)</text>
  <text x="196" y="304" class="s">object-ID picks</text>
  <text x="196" y="330" class="n">+ PBR, IBL, decals,</text>
  <text x="196" y="348" class="n">  particles, LOD</text>
  <text x="196" y="366" class="s">no SSAO (root only)</text>

  <line x1="323" y1="310" x2="334" y2="310" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- B3 IBL bake -->
  <rect x="336" y="226" width="136" height="168" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="346" y="248" class="bt">IBL bake (new)</text>
  <text x="346" y="268" class="n">only when the sky</text>
  <text x="346" y="286" class="n">changes</text>
  <text x="346" y="304" class="n">sky → cube 256²</text>
  <text x="346" y="322" class="n">GGX prefilter into</text>
  <text x="346" y="340" class="n">6 roughness mips</text>
  <text x="346" y="366" class="s">BRDF LUT: CPU,</text>
  <text x="346" y="384" class="s">once per process</text>

  <line x1="473" y1="310" x2="484" y2="310" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- B4 prepass + SSAO -->
  <rect x="486" y="226" width="136" height="168" rx="8" fill="#fef3c7" stroke="#d97706" stroke-dasharray="6 3"/>
  <text x="496" y="248" class="bt">Prepass + SSAO</text>
  <text x="496" y="268" class="w">when SSAO is on</text>
  <text x="496" y="286" class="w">depth-only opaque</text>
  <text x="496" y="304" class="w">GTAO at ½ res</text>
  <text x="496" y="322" class="w">blur + upsample</text>
  <text x="496" y="340" class="w">→ AO (R8)</text>
  <text x="496" y="366" class="s">waits for M11</text>
  <text x="496" y="384" class="s">step 1 (encoder API)</text>

  <line x1="623" y1="310" x2="634" y2="310" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- B5 scene pass -->
  <rect x="636" y="226" width="136" height="168" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="646" y="248" class="bt">Scene pass (HDR)</text>
  <text x="646" y="268" class="s">1. sky</text>
  <text x="646" y="286" class="s">2. opaque runs:</text>
  <text x="646" y="304" class="n">  + PBR (GGX)</text>
  <text x="646" y="322" class="n">  + IBL × AO</text>
  <text x="646" y="340" class="n">  + decals</text>
  <text x="646" y="358" class="s">3. transparent:</text>
  <text x="646" y="376" class="n">  + particles</text>

  <line x1="773" y1="310" x2="784" y2="310" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- B6 post -->
  <rect x="786" y="226" width="136" height="168" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="796" y="248" class="bt">Glow → tonemap</text>
  <text x="796" y="268" class="s">→ overlay pass</text>
  <text x="796" y="286" class="s">canvas, gizmos,</text>
  <text x="796" y="304" class="s">UI, dev overlay</text>
  <text x="796" y="330" class="s">(unchanged)</text>

  <text x="36" y="420" class="s">Fragment-stage budget of the scene pass with every feature on: sampled images 14 of 16 (shadow maps 6 · material 4: albedo, normal,</text>
  <text x="36" y="438" class="s">emission, ORM · radiance cube + BRDF LUT 2 · AO 1 · decal atlas 1) · samplers 8 of 16 (shadows 6 · material 1 · frame 1) · descriptor sets 3 of 4.</text>

  <!-- legend -->
  <rect x="20" y="470" width="18" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="46" y="482" class="s">exists today</text>
  <rect x="150" y="470" width="18" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="176" y="482" class="s">new in G6, built on Vulkan now</text>
  <rect x="380" y="470" width="18" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-dasharray="4 2"/>
  <text x="406" y="482" class="s">new in G6, built after M11 step 1</text>

  <text x="20" y="520" class="s">Only the IBL bake and the SSAO chain add GPU passes; PBR, decals, particles and LOD live in existing passes and CPU code.</text>
</svg>
