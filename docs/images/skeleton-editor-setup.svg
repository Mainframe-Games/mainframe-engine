<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Skeleton tab, Setup mode (proposal)</title>
  <desc>The editor with a Skeleton tab open on hero.mskel in Setup mode. A top strip has the Setup/Animate switch, tool buttons (select, create bone, pose, mesh, weights, constraint), an axes menu and view toggles. The left panel is the hierarchy: bones with their slots and attachments, then Skins, Constraints, Events and Images sections. The centre viewport shows a cut-out character with bones drawn over it; the selected bone thigh_l has a rotate gizmo. The right panel is the inspector for the selected bone. Numbered callouts explain each area.</desc>
  <rect width="960" height="760" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:12.5px;fill:#e5e7eb}
    .t{fill:#d1d5db;font-size:11.5px}
    .s{fill:#9ca3af;font-size:10.5px}
    .xs{fill:#9ca3af;font-size:9.5px}
    .m{fill:#d1d5db;font-size:10.5px;font-family:ui-monospace, Menlo, Consolas, monospace}
    .cap{fill:#374151;font-size:12px}
    .num{fill:#ffffff;font-size:10.5px;font-weight:700}
    .g{fill:none;stroke:#d1d5db;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .btn{fill:#2f333d;stroke:#3b3f4b}
    .on{fill:#1d4ed8;stroke:#3b82f6}
    .fld{fill:#121418;stroke:#3b3f4b}
    .bone{fill:#9ca3af;fill-opacity:0.55;stroke:#e5e7eb;stroke-width:0.8}
    .sel{fill:#60a5fa;fill-opacity:0.8;stroke:#ffffff;stroke-width:1}
    .art{stroke:#111827;stroke-width:1}
  </style>
  <defs>
    <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#2b2e36"/><rect width="8" height="8" fill="#30333c"/><rect x="8" y="8" width="8" height="8" fill="#30333c"/>
    </pattern>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="920" height="600" rx="8" fill="#1f2128" stroke="#111827"/>
  <rect x="20" y="20" width="920" height="26" rx="8" fill="#15171c"/>
  <rect x="20" y="38" width="920" height="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/><circle cx="54" cy="33" r="5" fill="#f59e0b"/><circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="480" y="37" class="s" text-anchor="middle">Mainframe Editor — MyGame — hero.mskel*</text>

  <!-- menu -->
  <rect x="20" y="46" width="920" height="24" fill="#2a2d36"/>
  <text x="32" y="62" class="t">File   Edit   View   Project   Run   Help</text>

  <!-- document tabs -->
  <rect x="20" y="70" width="920" height="24" fill="#1a1c22"/>
  <rect x="24" y="73" width="120" height="21" rx="3" fill="#262931"/>
  <text x="34" y="88" class="s">◇ Level.mscene</text>
  <rect x="148" y="73" width="120" height="21" rx="3" fill="#323642" stroke="#3b82f6"/>
  <path d="M158,85 l8,-6 2,2 -8,6 z" fill="#fbbf24"/>
  <text x="174" y="88" class="t">hero.mskel*</text>

  <!-- mode + tool strip -->
  <rect x="20" y="94" width="920" height="32" fill="#2a2d36"/>
  <rect x="28" y="99" width="132" height="22" rx="4" class="fld"/>
  <rect x="30" y="101" width="64" height="18" rx="3" class="on"/>
  <text x="62" y="114" class="t" text-anchor="middle">Setup</text>
  <text x="126" y="114" class="s" text-anchor="middle">Animate</text>
  <!-- tools -->
  <rect x="176" y="99" width="22" height="22" rx="3" class="btn"/><path d="M183,105 l8,5 -4,1 -2,4 z" class="g"/>
  <rect x="202" y="99" width="22" height="22" rx="3" class="on"/><path d="M207,116 l10,-10 2,2 -10,10 z M216,107 l3,-3" class="g"/>
  <rect x="228" y="99" width="22" height="22" rx="3" class="btn"/><circle cx="239" cy="110" r="5" class="g"/><path d="M239,103 v3 M239,114 v3" class="g"/>
  <rect x="254" y="99" width="22" height="22" rx="3" class="btn"/><path d="M259,116 l6,-11 6,11 z M265,105 v11" class="g"/>
  <rect x="280" y="99" width="22" height="22" rx="3" class="btn"/><circle cx="291" cy="110" r="6" fill="none" stroke="#f472b6" stroke-width="1.4"/><circle cx="291" cy="110" r="2" fill="#f472b6"/>
  <rect x="306" y="99" width="22" height="22" rx="3" class="btn"/><path d="M311,115 l6,-8 6,8 M317,107 v-3" class="g"/><circle cx="317" cy="103" r="1.6" fill="#d1d5db"/>
  <line x1="338" y1="101" x2="338" y2="119" stroke="#3b3f4b"/>
  <!-- transform modes -->
  <rect x="346" y="99" width="22" height="22" rx="3" class="on"/><path d="M357,104 a6,6 0 1 1 -6,6" class="g"/><path d="M351,108 l0,3 3,-1" class="g"/>
  <rect x="372" y="99" width="22" height="22" rx="3" class="btn"/><path d="M383,103 v14 M376,110 h14" class="g"/>
  <rect x="398" y="99" width="22" height="22" rx="3" class="btn"/><rect x="404" y="105" width="10" height="10" class="g"/>
  <rect x="424" y="99" width="22" height="22" rx="3" class="btn"/><path d="M429,116 l4,-12 h8 l-4,12 z" class="g"/>
  <rect x="452" y="99" width="70" height="22" rx="3" class="fld"/><text x="460" y="114" class="s">Local ▾</text>
  <rect x="526" y="99" width="22" height="22" rx="3" class="btn"/><path d="M531,105 h12 M531,110 h12 M531,115 h12" class="g"/>
  <text x="556" y="114" class="xs">snap 15°</text>
  <!-- view toggles -->
  <g transform="translate(700,99)">
    <rect width="22" height="22" rx="3" class="on"/><path d="M5,15 l12,-8" stroke="#fbbf24" stroke-width="2"/>
    <rect x="26" width="22" height="22" rx="3" class="on"/><rect x="31" y="6" width="12" height="10" class="g"/>
    <rect x="52" width="22" height="22" rx="3" class="btn"/><path d="M57,16 l6,-10 6,10 z" class="g"/>
    <rect x="78" width="22" height="22" rx="3" class="btn"/><rect x="83" y="6" width="12" height="10" fill="none" stroke="#f87171" stroke-dasharray="2 2"/>
    <rect x="104" width="22" height="22" rx="3" class="btn"/><circle cx="111" cy="11" r="4" fill="none" stroke="#f87171"/><circle cx="119" cy="11" r="4" fill="none" stroke="#4ade80"/>
    <rect x="130" width="80" height="22" rx="3" class="fld"/><text x="138" y="15" class="s">Checker ▾</text>
  </g>

  <!-- left: hierarchy -->
  <rect x="24" y="130" width="196" height="486" fill="#262931" stroke="#3b3f4b"/>
  <text x="32" y="148" class="hdr">Hierarchy</text>
  <rect x="32" y="156" width="180" height="20" rx="3" class="fld"/><text x="40" y="170" class="xs">⌕ filter</text>
  <g class="t">
    <text x="32" y="196">▾ ✦ root</text>
    <text x="44" y="214">▾ ✦ hips</text>
    <text x="58" y="232">▾ ✦ torso</text>
    <text x="74" y="250" class="s">▾ ▭ body</text>
    <text x="90" y="268" class="s">▦ body</text><text x="150" y="268" class="xs">mesh</text>
    <text x="90" y="286" class="s">▦ body_armor</text><text x="172" y="286" class="xs">linked</text>
    <text x="74" y="304" class="s">▸ ▭ glow</text><text x="122" y="304" class="xs">additive</text>
    <text x="74" y="322">▸ ✦ head</text>
  </g>
  <rect x="38" y="329" width="178" height="18" fill="#1d4ed8" opacity="0.55"/>
  <text x="58" y="342" class="t">▾ ✦ thigh_l</text>
  <text x="74" y="360" class="t">▸ ✦ shin_l</text>
  <text x="74" y="378" class="s">▸ ▭ leg_l</text>
  <text x="58" y="396" class="t">▸ ✦ thigh_r</text>
  <text x="44" y="414" class="t">▸ ✦ foot_l_target</text>
  <line x1="28" y1="426" x2="216" y2="426" stroke="#3b3f4b"/>
  <text x="32" y="444" class="hdr">Skins</text>
  <text x="40" y="462" class="t">● default</text><text x="40" y="480" class="s">○ armor</text>
  <text x="32" y="504" class="hdr">Constraints</text>
  <text x="40" y="522" class="t">↗ leg_l_ik</text><text x="110" y="522" class="xs">IK</text>
  <text x="40" y="540" class="t">≈ hair</text><text x="110" y="540" class="xs">physics</text>
  <text x="32" y="564" class="hdr">Events</text>
  <text x="40" y="582" class="t">♪ footstep</text>
  <text x="32" y="606" class="hdr">Images</text><text x="90" y="606" class="xs">14 · Images/</text>

  <!-- centre viewport -->
  <rect x="224" y="130" width="500" height="486" fill="url(#chk)" stroke="#3b3f4b"/>
  <!-- axes -->
  <line x1="474" y1="140" x2="474" y2="606" stroke="#4ade80" stroke-opacity="0.25"/>
  <line x1="234" y1="530" x2="714" y2="530" stroke="#f87171" stroke-opacity="0.25"/>
  <!-- character art -->
  <g class="art">
    <rect x="440" y="244" width="70" height="120" rx="22" fill="#4b7bb5"/>
    <circle cx="476" cy="214" r="32" fill="#f2c9a0"/>
    <path d="M444,206 q32,-46 64,0 q-10,-18 -32,-18 q-22,0 -32,18 z" fill="#7c4a2d"/>
    <rect x="446" y="352" width="26" height="92" rx="12" fill="#2f4f6f" transform="rotate(8 459 352)"/>
    <rect x="452" y="434" width="24" height="88" rx="11" fill="#2f4f6f"/>
    <rect x="482" y="352" width="26" height="170" rx="12" fill="#284560"/>
    <ellipse cx="466" cy="524" rx="22" ry="8" fill="#3a2a20"/>
    <ellipse cx="500" cy="524" rx="22" ry="8" fill="#3a2a20"/>
    <circle cx="476" cy="290" r="16" fill="#fbbf24" fill-opacity="0.35" stroke="none"/>
  </g>
  <!-- bones (tapered) -->
  <path d="M476,368 l6,-6 l-6,-72 l-6,72 z" class="bone"/>
  <path d="M476,290 l5,-5 l-5,-50 l-5,50 z" class="bone"/>
  <path d="M476,240 l4,-4 l-4,-40 l-4,40 z" class="bone"/>
  <path d="M470,368 l-6,4 l-4,70 l8,-2 z" class="sel"/>
  <path d="M462,440 l-5,4 l2,72 l7,-4 z" class="bone"/>
  <path d="M486,368 l6,4 l4,140 l-8,-2 z" class="bone"/>
  <circle cx="476" cy="368" r="4" fill="#e5e7eb"/>
  <circle cx="470" cy="368" r="3.5" fill="#ffffff"/>
  <!-- ik target -->
  <circle cx="466" cy="520" r="7" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M459,520 h14 M466,513 v14" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="470" y1="368" x2="466" y2="520" stroke="#f59e0b" stroke-dasharray="3 3" stroke-opacity="0.8"/>
  <!-- rotate gizmo on selected bone -->
  <circle cx="470" cy="368" r="46" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M470,368 L466,438" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="520" y="334" width="96" height="20" rx="3" fill="#111827" fill-opacity="0.85"/>
  <text x="528" y="348" class="m">rot  95.0°</text>
  <!-- viewport footer -->
  <text x="232" y="608" class="xs">zoom 100%   ·   hips ▸ thigh_l   ·   Alt: move without children</text>

  <!-- right: inspector -->
  <rect x="728" y="130" width="208" height="486" fill="#262931" stroke="#3b3f4b"/>
  <text x="736" y="148" class="hdr">Bone</text>
  <text x="782" y="148" class="t">thigh_l</text>
  <g class="s">
    <text x="736" y="176">Parent</text><rect x="800" y="164" width="128" height="18" rx="3" class="fld"/><text x="806" y="177" class="t">hips ▾</text>
    <text x="736" y="202">X / Y</text><rect x="800" y="190" width="62" height="18" rx="3" class="fld"/><text x="806" y="203" class="m">-6.0</text><rect x="866" y="190" width="62" height="18" rx="3" class="fld"/><text x="872" y="203" class="m">4.0</text>
    <text x="736" y="228">Rotation</text><rect x="800" y="216" width="128" height="18" rx="3" fill="#121418" stroke="#3b82f6"/><text x="806" y="229" class="m">95.0</text>
    <text x="736" y="254">Scale</text><rect x="800" y="242" width="62" height="18" rx="3" class="fld"/><text x="806" y="255" class="m">1.00</text><rect x="866" y="242" width="62" height="18" rx="3" class="fld"/><text x="872" y="255" class="m">1.00</text>
    <text x="736" y="280">Shear</text><rect x="800" y="268" width="62" height="18" rx="3" class="fld"/><text x="806" y="281" class="m">0</text><rect x="866" y="268" width="62" height="18" rx="3" class="fld"/><text x="872" y="281" class="m">0</text>
    <text x="736" y="306">Length</text><rect x="800" y="294" width="128" height="18" rx="3" class="fld"/><text x="806" y="307" class="m">42</text>
    <text x="736" y="332">Inherit</text><rect x="800" y="320" width="128" height="18" rx="3" class="fld"/><text x="806" y="333" class="t">Normal ▾</text>
    <text x="736" y="358">Colour</text><rect x="800" y="346" width="18" height="18" rx="3" fill="#9ca3af"/>
    <text x="736" y="384">Skin required</text><rect x="830" y="372" width="14" height="14" rx="2" class="fld"/>
  </g>
  <line x1="732" y1="398" x2="932" y2="398" stroke="#3b3f4b"/>
  <text x="736" y="418" class="hdr">Slots on this bone</text>
  <text x="744" y="438" class="t">▭ leg_l</text><text x="800" y="438" class="xs">Normal · leg_l</text>
  <rect x="736" y="452" width="22" height="22" rx="3" class="btn"/><path d="M742,463 h10 M747,458 v10" class="g"/>
  <text x="766" y="467" class="xs">Add slot</text>
  <line x1="732" y1="486" x2="932" y2="486" stroke="#3b3f4b"/>
  <text x="736" y="506" class="hdr">Constraints using it</text>
  <text x="744" y="526" class="t">↗ leg_l_ik</text><text x="810" y="526" class="xs">chain [thigh_l, shin_l]</text>

  <!-- callouts -->
  <g>
    <circle cx="94" cy="92" r="9" fill="#2563eb"/><text x="94" y="96" class="num" text-anchor="middle">1</text>
    <circle cx="212" cy="138" r="9" fill="#2563eb"/><text x="212" y="142" class="num" text-anchor="middle">2</text>
    <circle cx="600" cy="300" r="9" fill="#2563eb"/><text x="600" y="304" class="num" text-anchor="middle">3</text>
    <circle cx="560" cy="480" r="9" fill="#2563eb"/><text x="560" y="484" class="num" text-anchor="middle">4</text>
    <circle cx="924" cy="138" r="9" fill="#2563eb"/><text x="924" y="142" class="num" text-anchor="middle">5</text>
  </g>
  <line x1="568" y1="482" x2="474" y2="518" stroke="#3b82f6" stroke-dasharray="3 3"/>

  <!-- caption -->
  <g class="cap">
    <text x="20" y="648"><tspan font-weight="600">1</tspan>  Mode switch (Tab) and the Setup tools: select, create bone (B), test pose (P), mesh (M), weights (W), constraint; then rotate / translate / scale / shear,</text>
    <text x="34" y="666">axes (local, parent, world) and angle snap; view toggles: bones, images, meshes, bounding boxes, onion skin, background.</text>
    <text x="20" y="688"><tspan font-weight="600">2</tspan>  Hierarchy: bones with their slots and attachments (drag to re-parent or reorder), then skins, constraints, events and the image folder.</text>
    <text x="20" y="710"><tspan font-weight="600">3</tspan>  The selected bone with its rotate gizmo and live value; Alt moves a bone without moving its children.  <tspan font-weight="600">4</tspan>  An IK target and its chain.</text>
    <text x="20" y="732"><tspan font-weight="600">5</tspan>  Inspector for the selection: setup transform, length, inherit mode, colour, skin-required, its slots and the constraints that use it.</text>
  </g>
</svg>
