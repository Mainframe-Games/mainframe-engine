<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Terrain dock (proposal G8a)</title>
  <desc>The editor with a Terrain3D selected. The right dock shows a Terrain tab next to the Inspector, with the mode tabs (Sculpt, Paint, Foliage, Objects, Water; Paint is active), the brush panel (size, strength and falloff sliders, brush mask thumbnails) and the list of texture layers with thumbnails (Moss is chosen). In the viewport a blue brush ring with an inner falloff ring sits on the terrain, with a cursor label giving the mode, layer, size and strength.</desc>
  <rect width="960" height="680" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:13px;fill:#e5e7eb}
    .t{fill:#d7dbe4;font-size:12px}
    .s{fill:#8b93a5;font-size:11px}
    .m{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:11px;fill:#e5e7eb}
    .cap{fill:#374151;font-size:12px}
    .leg{fill:#1f2937;font-size:12px}
    .badge{fill:#1d4ed8}
    .bt{fill:#ffffff;font-size:11px;font-weight:700}
  </style>
  <defs>
    <pattern id="grass" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#4f7a34"/><path d="M1 6 L2 1 M4 6 L5 2" stroke="#6f9a46" stroke-width="1"/>
    </pattern>
    <pattern id="moss" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#5d7d2e"/><circle cx="1.5" cy="1.5" r="1.2" fill="#7f9c3c"/><circle cx="3.8" cy="3.6" r="0.9" fill="#46621f"/>
    </pattern>
    <pattern id="dirt" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#6e5238"/><circle cx="2" cy="2" r="0.8" fill="#8a6a48"/><circle cx="4.5" cy="4.2" r="0.6" fill="#55402c"/>
    </pattern>
    <pattern id="rock" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#7b7d80"/><path d="M0 3 L4 2 L8 4 M2 8 L3 5 L7 6" stroke="#5f6164" fill="none" stroke-width="0.8"/>
    </pattern>
    <pattern id="needles" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#7a5a32"/><path d="M0 1 L4 3 M2 5 L6 4" stroke="#a07a44" stroke-width="0.8"/>
    </pattern>
    <radialGradient id="mask1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#121418"/></radialGradient>
    <linearGradient id="mask5" x1="0" x2="1"><stop offset="0" stop-color="#121418"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#121418"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fa8c9"/><stop offset="1" stop-color="#c9d9e3"/></linearGradient>
  </defs>

  <!-- window -->
  <rect x="20" y="20" width="920" height="480" rx="8" fill="#1f2128" stroke="#111827"/>
  <rect x="20" y="20" width="920" height="26" rx="8" fill="#15171c"/>
  <circle cx="38" cy="33" r="5" fill="#ef4444"/><circle cx="54" cy="33" r="5" fill="#f59e0b"/><circle cx="70" cy="33" r="5" fill="#22c55e"/>
  <text x="372" y="38" class="s">Mainframe Engine — Forest — world.mscene*</text>

  <!-- toolbar -->
  <rect x="20" y="46" width="920" height="30" fill="#262931"/>
  <g>
    <rect x="32" y="52" width="22" height="18" rx="3" fill="#343947"/><text x="38" y="65" class="t">↖</text>
    <rect x="58" y="52" width="22" height="18" rx="3" fill="#343947"/><text x="63" y="65" class="t">✥</text>
    <rect x="84" y="52" width="22" height="18" rx="3" fill="#343947"/><text x="89" y="65" class="t">⟳</text>
    <rect x="110" y="52" width="22" height="18" rx="3" fill="#343947"/><text x="115" y="65" class="t">⤢</text>
    <rect x="452" y="52" width="22" height="18" rx="3" fill="#166534"/><text x="459" y="65" class="t">▶</text>
    <rect x="478" y="52" width="22" height="18" rx="3" fill="#343947"/><text x="484" y="65" class="t">⏹</text>
  </g>

  <!-- scene tree -->
  <rect x="24" y="80" width="176" height="300" fill="#1f2128" stroke="#2f333d"/>
  <rect x="24" y="80" width="176" height="24" fill="#262931"/>
  <text x="34" y="97" class="hdr">Scene</text>
  <text x="34" y="124" class="t">▾ ◇ world</text>
  <text x="50" y="144" class="t">☀ Sun</text>
  <text x="50" y="164" class="t">◐ WorldEnvironment</text>
  <rect x="44" y="172" width="152" height="18" fill="#1d4ed8" opacity="0.6"/>
  <text x="50" y="185" class="t">⛰ Terrain</text>
  <text x="50" y="206" class="t">◉ Player</text>
  <text x="50" y="226" class="t">▸ ◇ Cabins</text>
  <text x="34" y="352" class="s">Chunks, foliage and objects</text>
  <text x="34" y="368" class="s">are internal and not listed.</text>

  <!-- viewport -->
  <rect x="204" y="80" width="420" height="300" fill="#20232a" stroke="#2f333d"/>
  <rect x="204" y="80" width="112" height="22" fill="#2f333d"/><text x="214" y="96" class="t">world.mscene*</text>
  <rect x="208" y="104" width="412" height="272" fill="url(#sky)"/>
  <!-- far hills -->
  <path d="M208 196 L260 170 L318 186 L372 160 L430 178 L492 152 L556 174 L620 162 L620 230 L208 230 Z" fill="#6f8a7a"/>
  <!-- terrain, layered patches -->
  <path d="M208 220 L270 200 L336 214 L400 196 L470 210 L540 192 L620 206 L620 376 L208 376 Z" fill="url(#grass)"/>
  <path d="M208 262 Q260 238 320 254 T430 250 L436 300 Q360 318 290 300 T208 310 Z" fill="url(#dirt)" opacity="0.9"/>
  <path d="M500 214 L548 196 L600 206 L620 226 L620 300 Q580 286 556 262 Q528 236 500 232 Z" fill="url(#rock)"/>
  <path d="M330 300 Q400 280 470 296 Q520 310 560 300 L620 330 L620 376 L280 376 Q300 330 330 300 Z" fill="url(#moss)"/>
  <path d="M208 330 Q240 320 270 336 L262 376 L208 376 Z" fill="url(#needles)"/>
  <!-- brush disc and rings -->
  <ellipse cx="414" cy="318" rx="74" ry="30" fill="#3b82f6" fill-opacity="0.16"/>
  <ellipse cx="414" cy="318" rx="74" ry="30" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <ellipse cx="414" cy="318" rx="37" ry="15" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- cursor -->
  <polygon points="414,318 414,334 418,330 421,337 424,336 421,329 427,329" fill="#ffffff" stroke="#111827" stroke-width="0.8"/>
  <!-- cursor label -->
  <rect x="426" y="332" width="190" height="36" rx="4" fill="#111827" fill-opacity="0.92" stroke="#2f333d"/>
  <text x="434" y="347" class="m">Paint · Moss · 12 m · 60 %</text>
  <text x="434" y="362" class="m">Moss 72 % · slope 8°</text>
  <text x="216" y="120" style="fill:#1f2937;font-size:11px">◰ Perspective · Terrain: Paint</text>

  <!-- right dock -->
  <rect x="628" y="80" width="308" height="416" fill="#1f2128" stroke="#2f333d"/>
  <!-- tab strip -->
  <rect x="628" y="80" width="308" height="26" fill="#15171c"/>
  <rect x="632" y="84" width="84" height="22" fill="#262931"/><text x="646" y="99" class="s">Inspector</text>
  <rect x="718" y="84" width="84" height="22" fill="#1f2128"/><rect x="718" y="84" width="84" height="2" fill="#3b82f6"/>
  <text x="730" y="99" class="t">⛰ Terrain</text>
  <!-- header -->
  <text x="640" y="126" class="hdr">Terrain</text>
  <text x="700" y="126" class="s">Realistic · 1024 m · 1 m</text>
  <text x="640" y="142" style="fill:#f59e0b;font-size:11px">unsaved: splat-0</text>
  <!-- mode tabs -->
  <g>
    <rect x="640" y="150" width="54" height="40" rx="4" fill="#262931" stroke="#2f333d"/>
    <text x="659" y="168" class="t">⛰</text><text x="648" y="184" class="s">Sculpt</text>
    <rect x="698" y="150" width="54" height="40" rx="4" fill="#1d4ed8"/>
    <text x="717" y="168" class="t">🖌</text><text x="710" y="184" style="fill:#e5e7eb;font-size:11px">Paint</text>
    <rect x="756" y="150" width="54" height="40" rx="4" fill="#262931" stroke="#2f333d"/>
    <text x="775" y="168" class="t">❦</text><text x="760" y="184" class="s">Foliage</text>
    <rect x="814" y="150" width="54" height="40" rx="4" fill="#262931" stroke="#2f333d"/>
    <text x="833" y="168" class="t">▣</text><text x="818" y="184" class="s">Objects</text>
    <rect x="872" y="150" width="54" height="40" rx="4" fill="#262931" stroke="#2f333d"/>
    <text x="891" y="168" class="t">💧</text><text x="881" y="184" class="s">Water</text>
  </g>
  <!-- paint tools -->
  <rect x="640" y="198" width="80" height="20" rx="3" fill="#343947" stroke="#3b82f6"/><text x="660" y="212" class="t">Layer</text>
  <rect x="724" y="198" width="96" height="20" rx="3" fill="#262931"/><text x="734" y="212" class="s">User channel</text>
  <rect x="824" y="198" width="44" height="20" rx="3" fill="#262931"/><text x="834" y="212" class="s">◯</text>
  <rect x="872" y="198" width="54" height="20" rx="3" fill="#262931"/><text x="884" y="212" class="s">▭ Rect</text>
  <!-- brush panel -->
  <text x="640" y="238" class="s">▾ Brush</text>
  <text x="648" y="258" class="t">Size</text>
  <rect x="712" y="252" width="140" height="4" rx="2" fill="#2f333d"/><rect x="712" y="252" width="34" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="746" cy="254" r="5" fill="#d7dbe4"/>
  <rect x="862" y="246" width="64" height="18" rx="2" fill="#121418"/><text x="870" y="259" class="m">12 m</text>
  <text x="648" y="282" class="t">Strength</text>
  <rect x="712" y="276" width="140" height="4" rx="2" fill="#2f333d"/><rect x="712" y="276" width="84" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="796" cy="278" r="5" fill="#d7dbe4"/>
  <rect x="862" y="270" width="64" height="18" rx="2" fill="#121418"/><text x="870" y="283" class="m">60 %</text>
  <text x="648" y="306" class="t">Falloff</text>
  <rect x="712" y="300" width="140" height="4" rx="2" fill="#2f333d"/><rect x="712" y="300" width="70" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="782" cy="302" r="5" fill="#d7dbe4"/>
  <rect x="862" y="294" width="64" height="18" rx="2" fill="#121418"/><text x="870" y="307" class="m">0.50</text>
  <!-- brush masks -->
  <rect x="648" y="318" width="30" height="30" fill="url(#mask1)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="684" y="318" width="30" height="30" fill="#121418" stroke="#2f333d"/>
  <path d="M690 336 Q694 322 700 330 Q706 320 708 334 Q704 344 696 342 Z" fill="#d7dbe4"/>
  <rect x="720" y="318" width="30" height="30" fill="#121418" stroke="#2f333d"/>
  <g fill="#d7dbe4"><circle cx="727" cy="325" r="2"/><circle cx="738" cy="328" r="2"/><circle cx="744" cy="338" r="2"/><circle cx="730" cy="340" r="2"/><circle cx="736" cy="334" r="1.5"/></g>
  <rect x="756" y="318" width="30" height="30" fill="#121418" stroke="#2f333d"/><rect x="762" y="324" width="18" height="18" fill="#d7dbe4"/>
  <rect x="792" y="318" width="30" height="30" fill="url(#mask5)" stroke="#2f333d"/>
  <text x="832" y="337" class="s">+ project masks</text>
  <!-- layer list -->
  <text x="640" y="370" class="s">▾ Layers (5 of 8)</text>
  <g>
    <rect x="644" y="378" width="282" height="22" fill="#262931"/>
    <rect x="648" y="381" width="16" height="16" fill="url(#grass)"/><text x="672" y="393" class="t">Forest grass</text><text x="880" y="393" class="s">grass</text>
    <rect x="644" y="402" width="282" height="22" fill="#1d4ed8" opacity="0.55"/>
    <rect x="648" y="405" width="16" height="16" fill="url(#moss)" stroke="#93c5fd"/><text x="672" y="417" class="t">Moss</text><text x="880" y="417" class="s">moss</text>
    <rect x="644" y="426" width="282" height="22" fill="#262931"/>
    <rect x="648" y="429" width="16" height="16" fill="url(#dirt)"/><text x="672" y="441" class="t">Forest floor</text><text x="880" y="441" class="s">dirt</text>
    <rect x="644" y="450" width="282" height="22" fill="#262931"/>
    <rect x="648" y="453" width="16" height="16" fill="url(#rock)"/><text x="672" y="465" class="t">Cliff rock</text><text x="808" y="465" class="s">triplanar</text><text x="880" y="465" class="s">rock</text>
    <rect x="644" y="474" width="282" height="18" fill="#262931"/>
    <rect x="648" y="476" width="14" height="14" fill="url(#needles)"/><text x="672" y="487" class="t">Pine needles</text><text x="880" y="487" class="s">dirt</text>
  </g>

  <!-- output -->
  <rect x="24" y="384" width="600" height="112" fill="#1f2128" stroke="#2f333d"/>
  <rect x="24" y="384" width="600" height="22" fill="#262931"/>
  <text x="34" y="400" class="hdr">Output</text>
  <text x="34" y="426" class="t">[10:14:02.311] [INFO] Terrain: 256 chunks, collision near bodies (r 96 m)</text>
  <text x="34" y="446" class="t">[10:14:40.902] [INFO] Undo: Paint Moss (4 chunks, 38 KB)</text>
  <text x="34" y="466" class="s">Shift erase layer · Ctrl+click pick · [ ] size · − = strength · Esc None</text>

  <!-- badges -->
  <circle cx="812" cy="95" r="9" class="badge"/><text x="808.5" y="99" class="bt">1</text>
  <circle cx="930" cy="170" r="9" class="badge"/><text x="926.5" y="174" class="bt">2</text>
  <circle cx="930" cy="276" r="9" class="badge"/><text x="926.5" y="280" class="bt">3</text>
  <circle cx="930" cy="410" r="9" class="badge"/><text x="926.5" y="414" class="bt">4</text>
  <circle cx="350" cy="292" r="9" class="badge"/><text x="346.5" y="296" class="bt">5</text>
  <circle cx="604" cy="322" r="9" class="badge"/><text x="600.5" y="326" class="bt">6</text>

  <!-- legend -->
  <g>
    <circle cx="34" cy="522" r="8" class="badge"/><text x="31" y="526" class="bt">1</text>
    <text x="50" y="526" class="leg">The Terrain tab: the viewport tool's dock, beside the Inspector. It opens when a Terrain3D is the only selected node.</text>
    <circle cx="34" cy="546" r="8" class="badge"/><text x="31" y="550" class="bt">2</text>
    <text x="50" y="550" class="leg">Mode tabs: Sculpt, Paint, Foliage, Objects, Water. Each mode has its tools below (here Layer, User channel, Rectangle).</text>
    <circle cx="34" cy="570" r="8" class="badge"/><text x="31" y="574" class="bt">3</text>
    <text x="50" y="574" class="leg">Brush: size in metres, strength, falloff (where the fade to the edge starts) and the mask thumbnails, shared by every mode.</text>
    <circle cx="34" cy="594" r="8" class="badge"/><text x="31" y="598" class="bt">4</text>
    <text x="50" y="598" class="leg">Content list: on a Realistic terrain the TerrainLayers with albedo thumbnails and tags; Faceted shows palette swatches.</text>
    <circle cx="34" cy="618" r="8" class="badge"/><text x="31" y="622" class="bt">5</text>
    <text x="50" y="622" class="leg">Brush ring draped on the ground (blue; orange with Shift, green with Ctrl), inner ring where the falloff starts, soft disc.</text>
    <circle cx="34" cy="642" r="8" class="badge"/><text x="31" y="646" class="bt">6</text>
    <text x="50" y="646" class="leg">Cursor label: mode, layer, size and strength, then the value under the cursor. It is reformatted only when a value changes.</text>
  </g>
  <text x="20" y="670" class="cap">One stroke is one undo entry (touched chunk tiles only). Cmd+S writes the dirty PNG layers, then the scene.</text>
</svg>
