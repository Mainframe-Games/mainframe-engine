<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Video editing mode — gapless preview (proposal)</title>
  <desc>The kept ranges R0, R1 and R2 of a recording are laid end to end on an output timeline. Each range gets an ffmpeg video decoder producing raw RGBA frames, and the next one starts one second before the current range ends. Audio is decoded range after range into one AudioStreamGenerator ring. Frames go through a queue into a Texture2D in a SubViewport published as engine://video-preview. The audio voice's FramesConsumed is the clock in output seconds, and VideoPlaybackPlan maps it back to source time and decides when to prefetch.</desc>
  <rect width="1000" height="590" fill="#ffffff"/>
  <style>
    .hdr{font-weight:600;font-size:12.5px;fill:#e8ebf2}
    .t{fill:#d7dbe4;font-size:11.5px}
    .s{fill:#8b93a5;font-size:10.5px}
    .xs{fill:#8b93a5;font-size:9.5px}
    .m{fill:#d7dbe4;font-size:10.5px;font-family:ui-monospace, Menlo, Consolas, monospace}
    .cap{fill:#374151;font-size:12px}
    .capb{fill:#111827;font-size:12.5px;font-weight:600}
    .btn{fill:#2f333d;stroke:#3b3f4b}
    .on{fill:#1d4ed8;stroke:#3b82f6}
    .g{fill:none;stroke:#d7dbe4;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
    .boxd{fill:#eef2ff;stroke:#6366f1;stroke-width:1.2}
    .boxg{fill:#ecfdf5;stroke:#10b981;stroke-width:1.2}
    .boxa{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .boxr{fill:#fef2f2;stroke:#ef4444;stroke-width:1.2}
    .dash{fill:none;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4}
    .arrow{fill:none;stroke:#475569;stroke-width:1.4;marker-end:url(#ah)}
    .arrowb{fill:none;stroke:#2563eb;stroke-width:1.4;marker-end:url(#ahb)}
    .k{fill:#111827;font-size:12px}
    .kb{fill:#111827;font-size:12.5px;font-weight:600}
    .ks{fill:#475569;font-size:11px}
    .km{fill:#334155;font-size:10.5px;font-family:ui-monospace, Menlo, Consolas, monospace}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <text x="20" y="36" class="kb">Source recording (kept ranges from the playhead)</text>
  <rect x="20.0" y="48" width="288.0" height="26" fill="#1D2E4D"/>
  <text x="164.0" y="65" class="t" text-anchor="middle">R0 kept</text>
  <rect x="308.0" y="48" width="115.2" height="26" fill="#1F1F24"/>
  <text x="365.6" y="65" class="s" text-anchor="middle">cut</text>
  <rect x="423.2" y="48" width="268.8" height="26" fill="#1D2E4D"/>
  <text x="557.6" y="65" class="t" text-anchor="middle">R1 kept</text>
  <rect x="692.0" y="48" width="76.8" height="26" fill="#1F1F24"/>
  <text x="730.4000000000001" y="65" class="s" text-anchor="middle">cut</text>
  <rect x="768.8" y="48" width="211.2" height="26" fill="#1D2E4D"/>
  <text x="874.4000000000001" y="65" class="t" text-anchor="middle">R2 kept</text>
  <text x="20" y="92" class="kb">Output timeline (VideoPlaybackPlan: the kept ranges laid end to end)</text>
  <rect x="20.0" y="102" width="359.0" height="22" fill="#1D2E4D"/>
  <text x="200.0" y="117" class="t" text-anchor="middle">R0</text>
  <rect x="380.0" y="102" width="335.0" height="22" fill="#1D2E4D"/>
  <text x="548.0" y="117" class="t" text-anchor="middle">R1</text>
  <rect x="716.0" y="102" width="263.0" height="22" fill="#1D2E4D"/>
  <text x="848.0" y="117" class="t" text-anchor="middle">R2</text>
  <text x="20" y="158" class="kb">Video: one ffmpeg decoder per range (raw RGBA, ≤ 960 px, ≤ 30 fps)</text>
  <rect x="20.0" y="168" width="360.0" height="22" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <text x="200.0" y="183" class="km" text-anchor="middle">ffmpeg -ss 0 -t 30 … -f rawvideo</text>
  <rect x="344.0" y="198" width="372.0" height="22" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <rect x="344.0" y="198" width="36.0" height="22" rx="4" fill="#bbf7d0" stroke="#10b981"/>
  <text x="346.0" y="194" class="ks">starts 1 s early</text>
  <text x="548.0" y="213" class="km" text-anchor="middle">ffmpeg -ss 42 -t 28 … -f rawvideo</text>
  <rect x="680.0" y="168" width="300.0" height="22" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <rect x="680.0" y="168" width="36.0" height="22" rx="4" fill="#bbf7d0" stroke="#10b981"/>
  <text x="682.0" y="164" class="ks">starts 1 s early</text>
  <text x="848.0" y="183" class="km" text-anchor="middle">ffmpeg -ss 78 -t 22 … -f rawvideo</text>
  <text x="20" y="262" class="kb">Audio: decoded range after range into one ring (f32le stereo at the mix rate, 8 ms fades)</text>
  <rect x="20.0" y="272" width="358.0" height="22" rx="4" class="boxa"/>
  <text x="200.0" y="287" class="km" text-anchor="middle">ffmpeg -ss 0 -t 30 … -f f32le</text>
  <rect x="380.0" y="272" width="334.0" height="22" rx="4" class="boxa"/>
  <text x="548.0" y="287" class="km" text-anchor="middle">ffmpeg -ss 42 -t 28 … -f f32le</text>
  <rect x="716.0" y="272" width="262.0" height="22" rx="4" class="boxa"/>
  <text x="848.0" y="287" class="km" text-anchor="middle">ffmpeg -ss 78 -t 22 … -f f32le</text>
  <rect x="20" y="326" width="220" height="96" rx="8" class="boxg"/>
  <text x="32" y="346" class="kb">Frame queue</text>
  <text x="32" y="364" class="ks">6 pooled RGBA buffers per decoder</text>
  <text x="32" y="379" class="ks">stamped with output time</text>
  <text x="32" y="394" class="ks">back-pressures ffmpeg</text>
  <rect x="280" y="326" width="220" height="96" rx="8" class="boxg"/>
  <text x="292" y="346" class="kb">Texture2D in a SubViewport</text>
  <text x="292" y="364" class="ks">SetPixels at most once per</text>
  <text x="292" y="379" class="ks">displayed frame (main thread)</text>
  <text x="292" y="394" class="ks">→ engine://video-preview</text>
  <rect x="540" y="326" width="200" height="96" rx="8" class="boxa"/>
  <text x="552" y="346" class="kb">AudioStreamGenerator</text>
  <text x="552" y="364" class="ks">one voice, 1.0 s ring</text>
  <text x="552" y="379" class="ks">Master bus, ProcessMode.Always</text>
  <text x="552" y="394" class="ks">→ audio device</text>
  <rect x="780" y="326" width="200" height="96" rx="8" class="boxd"/>
  <text x="792" y="346" class="kb">Clock</text>
  <text x="792" y="364" class="ks">FramesConsumed ÷ sample rate</text>
  <text x="792" y="379" class="ks">= output seconds</text>
  <text x="792" y="394" class="ks">(stopwatch without a device)</text>
  <path d="M240,374 L278,374" class="arrow"/>
  <path d="M740,374 L778,374" class="arrow"/>
  <path d="M120,220 L120,324" class="arrow"/>
  <path d="M640,296 L640,324" class="arrow"/>
  <rect x="280" y="450" width="460" height="80" rx="8" class="boxd"/>
  <text x="292" y="470" class="kb">VideoPlaybackPlan (pure)</text>
  <text x="292" y="488" class="ks">output time → range and source time: the frame to show and the playhead</text>
  <text x="292" y="503" class="ks">ShouldPrefetch(range, t): start the next video decoder 1 s before the range ends</text>
  <text x="292" y="518" class="ks">rebuilt from the playhead when the document changes (an edit while playing)</text>
  <path d="M880,422 C880,490 780,490 742,490" class="arrowb"/>
  <path d="M380,450 L380,424" class="arrowb"/>
  <text x="20" y="560" class="cap">Proposal. Cuts play without a gap: video switches decoders at the boundary (the next one is already running), and audio is one continuous</text>
  <text x="20" y="576" class="cap">stream, because each range is pushed after the previous one. Paused scrubbing decodes one frame (-ss t -frames:v 1), newest request wins.</text>
</svg>
