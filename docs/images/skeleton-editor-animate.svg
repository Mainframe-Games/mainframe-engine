<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Skeleton tab, Animate mode (proposal)</title>
  <desc>The Skeleton tab in Animate mode on the walk clip. The viewport shows the character mid-stride with red onion skins of earlier frames and green ones of later frames. Auto-key is on. The inspector shows key buttons next to animatable fields. The bottom panel has the transport, clip menu, length, fps and loop mode, then a split view: a dopesheet with rows per bone and slot, event markers and an audio waveform lane on the left, and a graph editor with rotation curves and bezier handles on the right. Numbered callouts explain the parts.</desc>
