  <!-- caption -->
  <g class="cap">
    <text x="20" y="738"><tspan font-weight="600">1</tspan>  Animate tools: pose, mesh (deform keys); auto-key (K, red when on), key all (Shift+K), pose copy and paste mirrored; onion skin and reference layer.</text>
    <text x="20" y="760"><tspan font-weight="600">2</tspan>  The current pose with onion skins (red: earlier frames, green: later) and a reference image; keys show in the hierarchy as diamonds.</text>
    <text x="20" y="782"><tspan font-weight="600">3</tspan>  Every animatable field has a key button: keyed at the playhead, changed since its key, or not keyed; the selected segments' curve.</text>
    <text x="20" y="804"><tspan font-weight="600">4</tspan>  Transport (loop, ping-pong, speed), the clip menu, length, fps, loop mode, mix preview into another clip, Dopesheet | Graph | Split.</text>
    <text x="20" y="826"><tspan font-weight="600">5</tspan>  Dopesheet: rows per timeline under their bone or slot, summary rows, a selected key; past-length time shaded.  <tspan font-weight="600">6</tspan>  Event markers and the</text>
    <text x="34" y="844">reference audio waveform, scrubbed with the playhead.  <tspan font-weight="600">7</tspan>  Graph editor: curves per component with bezier handles; the selected key and its value.</text>
  </g>
</svg>
